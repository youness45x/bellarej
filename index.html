  // Horseshoe arch (the Moroccan door/window shape), from its top down to bottomY.
  function archPath(cx, topY, w, bottomY) {
    const r = w * 0.56, cy = topY + r;
    const a = Math.acos((w / 2) / r);
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, bottomY);
    ctx.lineTo(cx - w / 2, cy + r * Math.sin(a));
    ctx.arc(cx, cy, r, Math.PI - a, Math.PI * 2 + a);
    ctx.lineTo(cx + w / 2, bottomY);
    ctx.closePath();
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

  // Calls fn(i, x) for each slot of a repeating layer that is on screen.
  function eachSlot(W, factor, slotW, fn) {
    const off = game.distance * factor;
    const first = Math.floor(off / slotW) - 1;
    for (let i = first; ; i++) {
      const x = i * slotW - off;
      if (x > W + slotW) break;
      fn(i, x);
    }
  }

  // ---------------------------------------------------------------------------
  // Shared scenery pieces
  // ---------------------------------------------------------------------------
  function drawPalm(x, baseY, hgt, leaf, leafDark, trunk) {
    ctx.strokeStyle = trunk; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, baseY); ctx.quadraticCurveTo(x + 10, baseY - hgt / 2, x + 4, baseY - hgt); ctx.stroke();
    const tx = x + 4, ty = baseY - hgt;
    for (let k = 0; k < 7; k++) {
      const a = -Math.PI / 2 + (k - 3) * 0.5;
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(a);
      ctx.fillStyle = k % 2 ? leafDark : leaf;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -7 * Math.sign(k - 3 || 1), 30, 4 * Math.sign(k - 3 || 1));
      ctx.quadraticCurveTo(14, 3, 0, 0); ctx.fill();
      ctx.restore();
    }
  }
  function drawCypress(x, baseY, hgt, c) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(x, baseY - hgt / 2, 7, hgt / 2, 0, 0, TAU); ctx.fill();
  }
  // A brass lantern; at night it glows.
  function drawLantern(x, y, s, lit) {
    if (lit) {
      const g = ctx.createRadialGradient(x, y + 6 * s, 2, x, y + 6 * s, 34 * s);
      g.addColorStop(0, 'rgba(255, 200, 100, 0.55)'); g.addColorStop(1, 'rgba(255, 200, 100, 0)');
      ctx.fillStyle = g; circle(x, y + 6 * s, 34 * s); ctx.fill();
    }
    ctx.fillStyle = '#6a4220';
    ctx.fillRect(x - 0.8 * s, y - 8 * s, 1.6 * s, 6 * s);
    ctx.beginPath(); ctx.moveTo(x - 6 * s, y); ctx.lineTo(x, y - 4 * s); ctx.lineTo(x + 6 * s, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lit ? '#ffd47a' : '#f3c86a';
    ctx.beginPath(); ctx.moveTo(x - 5 * s, y); ctx.lineTo(x + 5 * s, y); ctx.lineTo(x + 6.5 * s, y + 7 * s); ctx.lineTo(x + 4 * s, y + 13 * s); ctx.lineTo(x - 4 * s, y + 13 * s); ctx.lineTo(x - 6.5 * s, y + 7 * s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6a4220'; ctx.lineWidth = 1.2 * s;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 13 * s); ctx.moveTo(x - 6.5 * s, y + 7 * s); ctx.lineTo(x + 6.5 * s, y + 7 * s); ctx.stroke();
    ctx.fillStyle = '#6a4220'; ctx.fillRect(x - 4 * s, y + 13 * s, 8 * s, 2.2 * s);
  }
  function drawPot(x, baseY, s, pot, leaf, flower) {
    ctx.fillStyle = leaf;
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(x + (k - 2) * 3.5 * s, baseY - 13 * s - Math.abs(k - 2) * -1.5 * s, 3 * s, 7 * s, (k - 2) * 0.4, 0, TAU); ctx.fill(); }
    if (flower) { ctx.fillStyle = flower; for (let k = 0; k < 3; k++) { circle(x + (k - 1) * 5 * s, baseY - 19 * s + (k % 2) * 3 * s, 2.4 * s); ctx.fill(); } }
    ctx.fillStyle = pot;
    ctx.beginPath(); ctx.moveTo(x - 7 * s, baseY - 10 * s); ctx.lineTo(x + 7 * s, baseY - 10 * s); ctx.lineTo(x + 5 * s, baseY); ctx.lineTo(x - 5 * s, baseY); ctx.closePath(); ctx.fill();
    ctx.fillRect(x - 8 * s, baseY - 12 * s, 16 * s, 3 * s);
  }
  // A cat sitting on a wall, seen from the side; its tail swings now and then.
  function drawCat(x, baseY, c, belly) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(x, baseY - 8, 8, 8, 0, 0, TAU); ctx.fill();           // body
    circle(x + 6, baseY - 18, 6); ctx.fill();                                              // head
    ctx.beginPath(); ctx.moveTo(x + 2, baseY - 22); ctx.lineTo(x + 3, baseY - 29); ctx.lineTo(x + 7, baseY - 23); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 7, baseY - 23); ctx.lineTo(x + 11, baseY - 28); ctx.lineTo(x + 11, baseY - 20); ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const sw = Math.sin(game.time * 2 + x) * 4;
    ctx.beginPath(); ctx.moveTo(x - 7, baseY - 3); ctx.quadraticCurveTo(x - 16, baseY - 6, x - 14 + sw * 0.3, baseY - 16 - sw); ctx.stroke();
    ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(x + 4, baseY - 6, 3.5, 5, 0, 0, TAU); ctx.fill();
  }
  function drawPigeon(x, baseY, c) {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(x, baseY - 5, 6.5, 4.5, -0.15, 0, TAU); ctx.fill();
    circle(x + 5, baseY - 9, 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 5, baseY - 6); ctx.lineTo(x - 11, baseY - 4); ctx.lineTo(x - 5, baseY - 3); ctx.fill();
    ctx.fillStyle = '#e8a33a'; ctx.fillRect(x + 7.5, baseY - 9.5, 2.5, 1.4);
  }
  // A hanging carpet: red field, border, a diamond medallion and a fringe.
  function drawCarpet(x, y, w, h, c1, c2, c3) {
    ctx.fillStyle = c1; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
    ctx.fillStyle = c3;
    ctx.beginPath(); ctx.moveTo(x + w / 2, y + 8); ctx.lineTo(x + w - 8, y + h / 2); ctx.lineTo(x + w / 2, y + h - 8); ctx.lineTo(x + 8, y + h / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c2;
    ctx.beginPath(); ctx.moveTo(x + w / 2, y + h / 2 - 7); ctx.lineTo(x + w / 2 + 6, y + h / 2); ctx.lineTo(x + w / 2, y + h / 2 + 7); ctx.lineTo(x + w / 2 - 6, y + h / 2); ctx.closePath(); ctx.fill();
    for (const yy of [y + 9, y + h - 9]) { for (let k = 0; k < 3; k++) { ctx.fillRect(x + 7 + k * (w - 16) / 2, yy - 1.5, 3, 3); } }
    ctx.strokeStyle = c3; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let k = 0; k <= w; k += 3) { ctx.moveTo(x + k, y + h); ctx.lineTo(x + k, y + h + 4); }
    ctx.stroke();
  }
  function drawGull(x, y, s, c) {
    ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const f = Math.sin(game.time * 6 + x) * 2;
    ctx.beginPath(); ctx.moveTo(x - 7 * s, y - f); ctx.quadraticCurveTo(x - 3 * s, y - 4 * s, x, y); ctx.quadraticCurveTo(x + 3 * s, y - 4 * s, x + 7 * s, y - f); ctx.stroke();
  }

  // ---------------------------------------------------------------------------
  // Sky
  // ---------------------------------------------------------------------------
  // The sky gradient and the sun (or moon) never move, so each place's sky is painted once
  // per screen size and then copied every frame: much less work for older phones.
  const skyCache = new Map();
  function paintSkyBase(c, L, W) {
    const g = c.createLinearGradient(0, 0, 0, GROUND_TOP);
    g.addColorStop(0, L.sky[0]); g.addColorStop(0.55, L.sky[1]); g.addColorStop(1, L.sky[2]);
    c.fillStyle = g;
    c.fillRect(0, 0, W, GROUND_TOP);
    const [sxk, sy, sr, sc, glow] = L.sun, sx = W * sxk;
    c.fillStyle = glow; c.beginPath(); c.arc(sx, sy, sr * 1.7, 0, TAU); c.fill();
    c.fillStyle = sc; c.beginPath(); c.arc(sx, sy, sr, 0, TAU); c.fill();
    if (L.stars) { // moon craters
      c.fillStyle = 'rgba(190, 185, 160, 0.5)';
      for (const [dx, dy, r] of [[-0.3, -0.2, 0.22], [0.28, 0.25, 0.15], [0.1, -0.45, 0.1]]) { c.beginPath(); c.arc(sx + sr * dx, sy + sr * dy, sr * r, 0, TAU); c.fill(); }
    }
  }
  function drawSky(L, W) {
    const m = ctx.getTransform(), pw = ctx.canvas.width, ph = Math.ceil(GROUND_TOP * m.d);
    const key = LOOKS.indexOf(L) + ':' + pw + 'x' + ph;
    let img = skyCache.get(key);
    if (!img) {
      if (skyCache.size > 24) skyCache.clear();     // screen sizes change rarely; never let it grow
      img = document.createElement('canvas');
      img.width = pw; img.height = ph;
      const c = img.getContext('2d');
      c.setTransform(m.a, 0, 0, m.d, 0, 0);
      paintSkyBase(c, L, W);
      skyCache.set(key, img);
    }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(img, 0, 0); ctx.restore();
    if (L.stars) {
      ctx.fillStyle = '#fffbe8';
      for (let i = 0; i < 60; i++) {
        const x = hash(i, 30) * W, y = hash(i, 31) * 400;
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(game.time * (1.5 + hash(i, 32) * 2) + i);
        const r = 0.7 + hash(i, 33) * 1.5;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      ctx.globalAlpha = 1;
    }
    // Puffy clouds with a shaded underside, drifting slowly
    eachSlot(W, 0.04, 250, (i, x) => {
      if (hash(i, 1) < 0.35) return;
      const cx = x + hash(i, 2) * 110, cy = 54 + hash(i, 3) * 130, s = 0.7 + hash(i, 4) * 0.7;
      ctx.fillStyle = L.cloudShade;
      ctx.beginPath(); ctx.ellipse(cx, cy + 4 * s, 48 * s, 13 * s, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = L.cloud;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46 * s, 12 * s, 0, 0, TAU);
      ctx.ellipse(cx - 20 * s, cy - 8 * s, 20 * s, 15 * s, 0, 0, TAU);
      ctx.ellipse(cx + 4 * s, cy - 17 * s, 23 * s, 20 * s, 0, 0, TAU);
      ctx.ellipse(cx + 26 * s, cy - 6 * s, 17 * s, 12 * s, 0, 0, TAU);
      ctx.fill();
    });
    if (L.gulls) {
      eachSlot(W, 0.12, 420, (i, x) => {
        if (hash(i, 40) < 0.4) return;
        const n = L.gulls === 2 ? 3 : 2;
        for (let k = 0; k < n; k++) drawGull(x + hash(i, 41 + k) * 160, 150 + hash(i, 44 + k) * 140, 0.8 + hash(i, 47 + k) * 0.5, 'rgba(255,255,255,0.9)');
      });
    }
  }

  // ---------------------------------------------------------------------------
  // Far layers: mountains, hills, dunes or the sea
  // ---------------------------------------------------------------------------
  function ridge(W, factor, slotW, base, low, high, salt, smooth) {
    // a line of peaks across the screen, returned as points
    const off = game.distance * factor, first = Math.floor(off / slotW) - 1, pts = [];
    for (let i = first; i * slotW - off < W + slotW * 2; i++) pts.push({ x: i * slotW - off + hash(i, salt) * slotW * 0.35, y: low + hash(i, salt + 1) * (high - low), i });
    ctx.beginPath();
    ctx.moveTo(pts[0].x - slotW, base);
    ctx.lineTo(pts[0].x - slotW, pts[0].y);
    for (let k = 0; k < pts.length; k++) {
      const p = pts[k], n = pts[k + 1];
      if (smooth) { if (n) ctx.quadraticCurveTo(p.x, p.y, (p.x + n.x) / 2, (p.y + n.y) / 2); else ctx.lineTo(p.x, p.y); }
      else { ctx.lineTo(p.x, p.y); if (n) ctx.lineTo((p.x + n.x) / 2, Math.max(p.y, n.y) + 36 + hash(p.i, salt + 2) * 30); }
    }
    ctx.lineTo(pts[pts.length - 1].x + slotW, base);
    ctx.closePath();
    return pts;
  }
  function drawFar(L, W) {
    const c = L.farC;
    if (L.far === 'atlas') {
      ctx.fillStyle = c[0];
      const peaks = ridge(W, 0.06, 160, GROUND_TOP, 290, 400, 5, false); ctx.fill();
      ctx.fillStyle = c[2];
      for (const p of peaks) {
        if (p.y > 340) continue;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 22, p.y + 26); ctx.lineTo(p.x - 8, p.y + 20); ctx.lineTo(p.x, p.y + 28);
        ctx.lineTo(p.x + 10, p.y + 19); ctx.lineTo(p.x + 22, p.y + 26); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = c[1]; ridge(W, 0.09, 120, GROUND_TOP, 380, 430, 9, true); ctx.fill();
      ctx.fillStyle = c[3]; ctx.fillRect(0, 455, W, GROUND_TOP - 455);
    } else if (L.far === 'hills') {
      ctx.fillStyle = c[0]; ridge(W, 0.06, 180, GROUND_TOP, 330, 390, 12, true); ctx.fill();
      ctx.fillStyle = c[1]; ridge(W, 0.1, 140, GROUND_TOP, 380, 420, 15, true); ctx.fill();
      ctx.fillStyle = c[3]; ctx.fillRect(0, 470, W, GROUND_TOP - 470);
    } else if (L.far === 'rif') {
      ctx.fillStyle = c[2]; ridge(W, 0.05, 170, GROUND_TOP, 270, 330, 18, true); ctx.fill();
      ctx.fillStyle = c[0]; ridge(W, 0.08, 150, GROUND_TOP, 320, 380, 21, true); ctx.fill();
      ctx.fillStyle = c[1]; ridge(W, 0.12, 120, GROUND_TOP, 390, 430, 24, true); ctx.fill();
    } else if (L.far === 'dunes') {
      ctx.fillStyle = c[3]; ridge(W, 0.05, 200, GROUND_TOP, 380, 430, 27, true); ctx.fill();
      ctx.fillStyle = c[0]; ridge(W, 0.09, 170, GROUND_TOP, 420, 460, 30, true); ctx.fill();
      ctx.fillStyle = c[1]; ridge(W, 0.14, 150, GROUND_TOP, 455, 490, 33, true); ctx.fill();
    } else if (L.far === 'sea') {
      // distant headland, then the ocean with moving glints
      ctx.fillStyle = c[3]; ridge(W, 0.03, 260, 430, 395, 420, 36, true); ctx.fill();
      const g = ctx.createLinearGradient(0, 420, 0, GROUND_TOP);
      g.addColorStop(0, c[1]); g.addColorStop(1, c[0]);
      ctx.fillStyle = g; ctx.fillRect(0, 420, W, GROUND_TOP - 420);
      ctx.fillStyle = c[2];
      eachSlot(W, 0.2, 46, (i, x) => {
        const y = 432 + hash(i, 37) * 110;
        ctx.globalAlpha = 0.45 + 0.4 * Math.sin(game.time * 2 + i);
        ctx.fillRect(x + hash(i, 38) * 30, y, 10 + hash(i, 39) * 14, 2);
      });
      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------------
  // Towns (middle distance), each with its landmark
  // ---------------------------------------------------------------------------
  function koutoubia(x, topY, w, c, shade, tile, lit) {
    // tall square minaret with arched panels, a turquoise tile band, small lantern and three golden balls
    ctx.fillStyle = c; ctx.fillRect(x, topY, w, GROUND_TOP - topY);
    ctx.fillStyle = shade; ctx.fillRect(x + w * 0.74, topY, w * 0.26, GROUND_TOP - topY);
    ctx.fillStyle = tile; ctx.fillRect(x, topY + 6, w, 7);
    for (let k = 0; k < 4; k++) ctx.fillRect(x + k * (w / 3.4), topY - 6, w / 7, 6);
    ctx.fillStyle = c; ctx.fillRect(x + w * 0.28, topY - 26, w * 0.44, 20);
    ctx.fillStyle = tile; ctx.fillRect(x + w * 0.28, topY - 20, w * 0.44, 4);
    ctx.fillStyle = shade; ctx.beginPath(); ctx.moveTo(x + w * 0.24, topY - 26); ctx.lineTo(x + w * 0.5, topY - 36); ctx.lineTo(x + w * 0.76, topY - 26); ctx.fill();
    ctx.fillStyle = '#e8b43a'; ctx.fillRect(x + w * 0.5 - 1, topY - 54, 2, 18);
    for (const [dy, r] of [[-40, 3.4], [-46, 2.8], [-51, 2.1]]) { circle(x + w * 0.5, topY + dy, r); ctx.fill(); }
    ctx.fillStyle = lit ? '#ffcd6a' : shade;
    for (let k = 0; k < 3; k++) { archPath(x + w * 0.37, topY + 26 + k * 46, w * 0.24, topY + 52 + k * 46); ctx.fill(); }
    ctx.strokeStyle = shade; ctx.lineWidth = 2;
    ctx.strokeRect(x + w * 0.12, topY + 20, w * 0.5, 140);
  }
  function drawTown(L, W) {
    const c = L.townC;
    if (L.town === 'medina' || L.town === 'nightMedina') {
      const lit = L.town === 'nightMedina';
      // landmark first, so houses stand in front of its base
      eachSlot(W, 0.16, 760, (i, x) => {
        if (hash(i, 50) < 0.15) return;
        koutoubia(x + 260 + hash(i, 51) * 160, 250 + hash(i, 52) * 30, 46, c[3], c[4], c[5], lit);
      });
      eachSlot(W, 0.25, 56, (i, x) => {
        const h = 46 + hash(i, 8) * 64, top = GROUND_TOP - 28 - h;
        rect(x, top, 58, GROUND_TOP - top, c[0]);
        rect(x + 44, top, 14, GROUND_TOP - top, c[1]);
        rect(x - 1, top - 4, 60, 4, c[1]);
        ctx.fillStyle = c[2];
        if (hash(i, 9) > 0.3) ctx.fillRect(x + 11, top + 15, 7, 10);
        if (hash(i, 10) > 0.5) ctx.fillRect(x + 27, top + 15, 7, 10);
        if (hash(i, 61) > 0.75) ctx.fillRect(x + 18, top + 38, 7, 10);
        if (!lit && hash(i, 11) < 0.18) drawCypress(x + 30, top, 46 + hash(i, 12) * 20, '#3c6b3a');
        if (!lit && hash(i, 13) > 0.86) drawPalm(x + 20, top + 4, 50, '#4a8a46', '#3a743a', '#7a4a2c');
      });
    } else if (L.town === 'fes') {
      // the medina climbs a hill: two rows of houses, many with green-tiled roofs
      for (const [f, base, sz, salt] of [[0.18, 470, 40, 70], [0.26, 512, 52, 80]]) {
        eachSlot(W, f, sz, (i, x) => {
          const h = 30 + hash(i, salt) * 50, top = base - h;
          rect(x, top, sz + 1, GROUND_TOP - top, hash(i, salt + 1) > 0.5 ? c[0] : c[5]);
          rect(x + sz * 0.75, top, sz * 0.25 + 1, GROUND_TOP - top, c[1]);
          ctx.fillStyle = c[2];
          if (hash(i, salt + 2) > 0.35) ctx.fillRect(x + sz * 0.25, top + 12, 5, 8);
          if (hash(i, salt + 3) > 0.62) { // green tiled roof
            ctx.fillStyle = c[3];
            ctx.beginPath(); ctx.moveTo(x - 3, top); ctx.lineTo(x + sz / 2, top - 14); ctx.lineTo(x + sz + 3, top); ctx.closePath(); ctx.fill();
            ctx.fillStyle = c[4]; ctx.fillRect(x - 3, top - 2, sz + 6, 3);
          }
        });
      }
      eachSlot(W, 0.2, 640, (i, x) => { // Bou Inania style minaret with a green top
        const mx = x + 200 + hash(i, 90) * 200, top = 300 + hash(i, 91) * 30, w = 34;
        rect(mx, top, w, GROUND_TOP - top, c[0]); rect(mx + w * 0.72, top, w * 0.28, GROUND_TOP - top, c[1]);
        rect(mx, top + 10, w, 16, c[3]);
        ctx.fillStyle = c[3]; ctx.beginPath(); ctx.moveTo(mx + 6, top); ctx.lineTo(mx + w / 2, top - 14); ctx.lineTo(mx + w - 6, top); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e8b43a'; for (const [dy, r] of [[-18, 2.6], [-23, 2]]) { circle(mx + w / 2, top + dy, r); ctx.fill(); }
      });
    } else if (L.town === 'chaouen') {
      // blue and white houses stacked up the mountainside, a mosque tower here and there
      for (const [f, base, sz, salt] of [[0.14, 440, 34, 100], [0.2, 480, 42, 110], [0.27, 520, 52, 120]]) {
        eachSlot(W, f, sz, (i, x) => {
          const h = 26 + hash(i, salt) * 40, top = base - h, col = [c[0], c[1], c[4], c[0], c[2]][Math.floor(hash(i, salt + 1) * 5)];
          rect(x, top, sz + 1, GROUND_TOP - top, col);
          rect(x + sz * 0.78, top, sz * 0.22 + 1, GROUND_TOP - top, 'rgba(40, 70, 130, 0.18)');
          ctx.fillStyle = c[3];
          if (hash(i, salt + 2) > 0.4) ctx.fillRect(x + sz * 0.3, top + 10, 5, 8);
          if (hash(i, salt + 3) > 0.85) { ctx.fillStyle = c[5]; ctx.beginPath(); ctx.moveTo(x - 2, top); ctx.lineTo(x + sz / 2, top - 9); ctx.lineTo(x + sz + 2, top); ctx.fill(); }
        });
      }
      eachSlot(W, 0.16, 700, (i, x) => {
        const mx = x + 300 + hash(i, 130) * 200, top = 330, w = 26;
        rect(mx, top, w, 140, c[0]); rect(mx + w * 0.7, top, w * 0.3, 140, c[4]);
        ctx.fillStyle = c[2]; archPath(mx + w * 0.4, top + 14, 8, top + 30); ctx.fill();
        ctx.fillStyle = c[0]; ctx.fillRect(mx + 6, top - 12, 14, 12);
        ctx.fillStyle = '#e8b43a'; circle(mx + 13, top - 17, 2.4); ctx.fill();
      });
    } else if (L.town === 'kasbah') {
      // ksar: tapered mud towers with crenellations and carved triangles, an oasis around them
      eachSlot(W, 0.22, 230, (i, x) => {
        if (hash(i, 140) < 0.2) return;
        const bx = x + hash(i, 141) * 60, top = 336 + hash(i, 142) * 50, w = 120;
        rect(bx + 22, top + 30, w - 44, GROUND_TOP - top - 30, c[0]);
        for (const tx of [bx, bx + w - 30]) {
          const tt = top - 10 + hash(i, tx) * 10;
          ctx.fillStyle = c[0];
          ctx.beginPath(); ctx.moveTo(tx, GROUND_TOP); ctx.lineTo(tx + 3, tt); ctx.lineTo(tx + 27, tt); ctx.lineTo(tx + 30, GROUND_TOP); ctx.fill();
          ctx.fillStyle = c[1]; ctx.fillRect(tx + 20, tt, 7, GROUND_TOP - tt);
          for (let k = 0; k < 3; k++) ctx.fillRect(tx + 3 + k * 9, tt - 6, 6, 6);
          ctx.fillStyle = c[2];
          for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(tx + 7 + k * 6, tt + 18); ctx.lineTo(tx + 10 + k * 6, tt + 12); ctx.lineTo(tx + 13 + k * 6, tt + 18); ctx.fill(); }
          ctx.fillRect(tx + 12, tt + 30, 5, 7);
        }
        ctx.fillStyle = c[2]; ctx.fillRect(bx + 52, top + 50, 6, 8); ctx.fillRect(bx + 66, top + 50, 6, 8);
        ctx.fillStyle = c[1];
        for (let k = 0; k < 5; k++) ctx.fillRect(bx + 24 + k * 15, top + 24, 7, 6);
      });
    } else if (L.town === 'coastTown') {
      // white town behind the ramparts, with blue doors, a lighthouse every so often
      eachSlot(W, 0.24, 48, (i, x) => {
        const h = 26 + hash(i, 150) * 42, top = 500 - h;
        rect(x, top, 49, GROUND_TOP - top, c[0]);
        rect(x + 36, top, 13, GROUND_TOP - top, c[1]);
        ctx.fillStyle = c[2];
        if (hash(i, 151) > 0.35) ctx.fillRect(x + 10, top + 10, 6, 9);
        if (hash(i, 152) > 0.7) ctx.fillRect(x + 24, top + 10, 6, 9);
      });
      eachSlot(W, 0.24, 820, (i, x) => {
        const lx = x + 360 + hash(i, 153) * 200, top = 330;
        ctx.fillStyle = c[0];
        ctx.beginPath(); ctx.moveTo(lx, 500); ctx.lineTo(lx + 4, top); ctx.lineTo(lx + 22, top); ctx.lineTo(lx + 26, 500); ctx.fill();
        rect(lx + 16, top, 7, 170, c[1]);
        rect(lx + 1, top + 40, 24, 8, c[3]); rect(lx + 2, top + 92, 23, 8, c[3]);
        rect(lx - 2, top - 4, 30, 5, c[2]);
        rect(lx + 5, top - 18, 16, 14, '#fff2b0');
        ctx.fillStyle = c[2]; ctx.beginPath(); ctx.moveTo(lx + 2, top - 18); ctx.lineTo(lx + 13, top - 28); ctx.lineTo(lx + 24, top - 18); ctx.fill();
      });
      // rampart
      rect(0, 500, W, GROUND_TOP - 500, c[5]);
      ctx.fillStyle = c[4];
      eachSlot(W, 0.24, 24, (i, x) => ctx.fillRect(x, 493, 13, 8));
    }
  }

  // ---------------------------------------------------------------------------
  // Near layers: walls along the street with palms, pots, lanterns, cats and pigeons
  // ---------------------------------------------------------------------------
  function drawNear(L, W) {
    const c = L.nearC, lit = !!L.night;
    eachSlot(W, 0.5, 100, (i, x) => {
      const h = 34 + hash(i, 13) * 44, top = GROUND_TOP - h;
      if (L.near === 'oasis') {
        if (hash(i, 160) > 0.35) drawPalm(x + 30, GROUND_TOP, 70 + hash(i, 161) * 50, c[3], c[4], c[5]);
        if (hash(i, 162) > 0.55) drawPalm(x + 74, GROUND_TOP, 50 + hash(i, 163) * 40, c[4], c[3], c[5]);
        if (hash(i, 164) > 0.5) { // a low mud wall
          rect(x, GROUND_TOP - 26, 100, 26, c[0]); rect(x + 82, GROUND_TOP - 26, 18, 26, c[1]);
          for (let k = 0; k < 6; k++) rect(x + 3 + k * 16, GROUND_TOP - 31, 8, 5, c[0]);
        }
        return;
      }
      rect(x, top, 100, h, c[0]);
      rect(x + 82, top, 18, h, c[1]);
      if (L.near === 'riad') {
        for (let k = 0; k < 6; k++) rect(x + 4 + k * 16, top - 6, 8, 6, c[0]);
      } else if (L.near === 'fesNear') {
        ctx.fillStyle = c[5]; ctx.fillRect(x - 3, top - 5, 106, 7);
        ctx.fillStyle = c[6]; for (let k = 0; k < 13; k++) ctx.fillRect(x - 2 + k * 8, top - 5, 3, 7);
      } else if (L.near === 'chaouenNear') {
        rect(x, top - 4, 100, 5, c[2]);
        rect(x, GROUND_TOP - 8, 100, 8, c[1]);
      } else if (L.near === 'harbour') {
        rect(x, top - 4, 100, 5, c[2]);
        for (let k = 0; k < 5; k++) rect(x + 4 + k * 20, top - 12, 11, 8, c[0]);
      }
      if (hash(i, 14) > 0.45) { // door
        ctx.fillStyle = c[2]; archPath(x + 34, GROUND_TOP - 40, 20, GROUND_TOP); ctx.fill();
        if (L.near === 'riad' || L.near === 'fesNear') { ctx.fillStyle = '#e8b43a'; circle(x + 39, GROUND_TOP - 18, 1.6); ctx.fill(); }
      }
      if (L.near === 'chaouenNear' && hash(i, 170) > 0.3) {
        for (let k = 0; k < 3; k++) if (hash(i, 171 + k) > 0.4) drawPot(x + 14 + k * 26, top + 22 + hash(i, 175 + k) * 14, 0.7, c[5], c[3], c[4]);
      }
      if ((L.near === 'riad' || L.near === 'fesNear') && hash(i, 180) > 0.55) drawLantern(x + 62, top + 10, 0.9, lit);
      if (L.near === 'harbour' && hash(i, 181) > 0.6) { // a blue fishing boat leaning on the wall
        ctx.fillStyle = c[2]; ctx.beginPath(); ctx.moveTo(x + 50, GROUND_TOP - 16); ctx.lineTo(x + 96, GROUND_TOP - 16); ctx.lineTo(x + 88, GROUND_TOP); ctx.lineTo(x + 58, GROUND_TOP); ctx.closePath(); ctx.fill();
        rect(x + 52, GROUND_TOP - 16, 42, 3, c[6]);
      }
      if (hash(i, 15) > 0.62 && L.near !== 'chaouenNear') drawPalm(x + 72, GROUND_TOP, 80 + hash(i, 16) * 40, c[3], c[4], c[5]);
      if (L.near !== 'harbour' && hash(i, 182) > 0.78) drawPot(x + 88, GROUND_TOP, 1, c[6], c[3], L.near === 'chaouenNear' ? c[4] : null);
      // wall-top visitors
      const visitor = hash(i, 183);
      if (visitor > 0.9) drawCat(x + 20, top - (L.near === 'riad' ? 6 : 4), lit ? '#2a2236' : '#e3923f', lit ? '#3a3046' : '#f6e1c4');
      else if (visitor < 0.12) { drawPigeon(x + 30, top - 4, lit ? '#3a3f5a' : '#8a93a6'); drawPigeon(x + 48, top - 4, lit ? '#3a3f5a' : '#9aa3b6'); }
    });
  }

  // ---------------------------------------------------------------------------
  // Ground
  // ---------------------------------------------------------------------------
  function drawGround(L, W) {
    const top = GROUND_TOP, c = L.groundC;
    ctx.fillStyle = c[0];
    ctx.fillRect(0, top, W, T.groundHeight);
    const step = 24, off = -(game.distance % step);
    if (L.ground === 'zellige' || L.ground === 'steps') {
      const band = 18;
      ctx.fillStyle = c[2]; ctx.fillRect(0, top, W, band);
      for (let x = off - step; x < W + step; x += step) {
        ctx.fillStyle = c[3];
        ctx.beginPath(); ctx.moveTo(x + step / 2, top + 2); ctx.lineTo(x + step - 3, top + band / 2); ctx.lineTo(x + step / 2, top + band - 2); ctx.lineTo(x + 3, top + band / 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = c[4]; circle(x, top + band / 2, 2.8); ctx.fill();
        ctx.fillStyle = c[5]; circle(x, top + band / 2, 1.2); ctx.fill();
      }
      ctx.fillStyle = INK; ctx.fillRect(0, top, W, 3); ctx.fillRect(0, top + band, W, 2);
      // floor tiles in perspective-free rows
      ctx.fillStyle = c[1];
      const s2 = 36, off2 = -(game.distance % s2);
      for (let x = off2 - s2; x < W + s2; x += s2) {
        ctx.fillRect(x, top + band + 2, 2, T.groundHeight);
        ctx.beginPath(); ctx.moveTo(x + 18, top + band + 14); ctx.lineTo(x + 26, top + band + 22); ctx.lineTo(x + 18, top + band + 30); ctx.lineTo(x + 10, top + band + 22); ctx.closePath(); ctx.fill();
      }
      ctx.fillRect(0, top + band + 40, W, 2);
    } else if (L.ground === 'sand') {
      ctx.fillStyle = INK; ctx.fillRect(0, top, W, 3);
      ctx.fillStyle = c[2]; ctx.fillRect(0, top + 3, W, 8);
      ctx.strokeStyle = c[1]; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      const s2 = 44, off2 = -(game.distance % s2);
      for (let x = off2 - s2; x < W + s2; x += s2) {
        for (const [dy, dx] of [[24, 0], [42, 20], [62, 6]]) {
          ctx.beginPath(); ctx.moveTo(x + dx, top + dy); ctx.quadraticCurveTo(x + dx + 10, top + dy - 5, x + dx + 22, top + dy); ctx.stroke();
        }
      }
    } else if (L.ground === 'stone') {
      ctx.fillStyle = c[2]; ctx.fillRect(0, top, W, 16);
      ctx.fillStyle = c[3];
      for (let x = off - step; x < W + step; x += step) ctx.fillRect(x + 4, top + 5, 14, 6);
      ctx.fillStyle = INK; ctx.fillRect(0, top, W, 3); ctx.fillRect(0, top + 16, W, 2);
      ctx.fillStyle = c[1];
      const s2 = 40, off2 = -(game.distance % s2);
      for (let x = off2 - s2; x < W + s2; x += s2) { ctx.fillRect(x, top + 18, 2, 30); ctx.fillRect(x + 20, top + 48, 2, 36); }
      ctx.fillRect(0, top + 47, W, 2);
    }
  }

  function drawScene(wi, W) {
    const L = LOOKS[wi];
    drawSky(L, W);
    drawFar(L, W);
    drawTown(L, W);
    drawNear(L, W);
    drawGround(L, W);
  }

  // ---------------------------------------------------------------------------
  // Obstacles: tall walls in the style of the place they were built in.
  // Every decoration stays inside the collision box (plus the small ledge that has been
  // there since Phase 1), so what you see is what you hit.
  // ---------------------------------------------------------------------------
  function band(S, x, y, w, h) {
    if (S.band === 'zellige') {
      rect(x, y, w, h, '#f3e6cc');
      const n = 4, cw = w / n;
      for (let k = 0; k < n; k++) {
        ctx.fillStyle = k % 2 ? '#2f5fc4' : '#1f8a5a';
        const cx = x + cw * k + cw / 2, cy = y + h / 2;
        ctx.beginPath(); ctx.moveTo(cx, y + 2); ctx.lineTo(cx + cw / 2 - 2, cy); ctx.lineTo(cx, y + h - 2); ctx.lineTo(cx - cw / 2 + 2, cy); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c4222a'; circle(cx, cy, 1.6); ctx.fill();
      }
    } else if (S.band === 'triangles') {
      rect(x, y, w, h, S.shade);
      ctx.fillStyle = S.light;
      for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(x + 2 + k * 12, y + h - 2); ctx.lineTo(x + 8 + k * 12, y + 2); ctx.lineTo(x + 14 + k * 12, y + h - 2); ctx.fill(); }
    } else if (S.band === 'blue') {
      rect(x, y, w, h, '#2f6fb7'); rect(x, y + 5, w, 6, '#f2eee6');
    } else {
      rect(x, y, w, h, '#f3f6fb'); rect(x, y + 6, w, 4, '#a6c8f4');
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
  }

  // One "storey" of decoration, about 110 units tall, centred on (cx, cy) of the wall face.
  function storey(S, o, k, x, cy, w) {
    const pick = hash(o.id * 7 + k, 200);
    const cx = x + (w - 14) / 2;
    if (S.feature === 'carpet' && pick < 0.45) {
      // wooden pole with a carpet hanging from it
      rect(x + 4, cy - 42, w - 22, 4, '#6a4220');
      const cols = pick < 0.22 ? ['#b8262c', '#f3e6cc', '#2b3f8f'] : ['#2b3f8f', '#f5b52a', '#b8262c'];
      drawCarpet(x + 9, cy - 38, w - 32, 62, cols[0], cols[1], cols[2]);
      return;
    }
    if ((S.feature === 'carpet' || S.feature === 'cedar') && pick < 0.7) {
      // a lantern in an arched niche
      ctx.fillStyle = S.lit ? '#5a2e1c' : S.shade; archPath(cx, cy - 34, 30, cy + 22); ctx.fill();
      drawLantern(cx, cy - 18, 1.25, S.lit);
      return;
    }
    if (S.feature === 'cedar' && pick < 0.85) {
      // carved cedar window with a tiny tiled hood
      rect(cx - 15, cy - 30, 30, 40, '#7a4a2c');
      ctx.strokeStyle = '#a8703f'; ctx.lineWidth = 2;
      for (let a = 0; a < 3; a++) for (let b = 0; b < 4; b++) ctx.strokeRect(cx - 12 + a * 8, cy - 27 + b * 9, 8, 9);
      rect(cx - 18, cy - 36, 36, 6, '#1f8a5a');
      return;
    }
    if (S.feature === 'flowers') {
      // window with blue shutters and a pot of red geraniums
      rect(cx - 12, cy - 26, 24, 32, '#f3f6fb');
      rect(cx - 9, cy - 23, 18, 26, '#2a4f9a');
      rect(cx - 19, cy - 26, 7, 32, '#2f5fc4'); rect(cx + 12, cy - 26, 7, 32, '#2f5fc4');
      rect(cx - 16, cy + 6, 32, 4, '#f3f6fb');
      drawPot(cx - 7, cy + 6, 0.75, '#c0612f', '#3b7d3e', '#e0452b');
      drawPot(cx + 8, cy + 6, 0.65, '#c0612f', '#3b7d3e', '#f28bb0');
      return;
    }
    if (S.feature === 'kasbah') {
      // carved triangles, a small window and the ends of wooden beams
      ctx.fillStyle = S.shade;
      for (let r = 0; r < 2; r++) for (let q = 0; q < 4; q++) {
        ctx.beginPath(); ctx.moveTo(x + 8 + q * 12, cy - 20 + r * 12); ctx.lineTo(x + 14 + q * 12, cy - 30 + r * 12); ctx.lineTo(x + 20 + q * 12, cy - 20 + r * 12); ctx.fill();
      }
      rect(cx - 6, cy + 2, 12, 16, '#5a2e18');
      ctx.fillStyle = '#7a4a2c';
      for (let q = 0; q < 4; q++) { circle(x + 10 + q * 14, cy + 30, 2.6); ctx.fill(); }
      return;
    }
    if (S.feature === 'shutters') {
      if (pick < 0.3) { // fishing net and buoys
        ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 1.2;
        for (let q = 0; q < 6; q++) { ctx.beginPath(); ctx.moveTo(x + 6 + q * 9, cy - 32); ctx.lineTo(x + 6 + q * 9 + 8, cy + 18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 56 - q * 9, cy - 32); ctx.lineTo(x + 56 - q * 9 - 8, cy + 18); ctx.stroke(); }
        for (const [bx, bc] of [[x + 14, '#e0452b'], [x + 34, '#f5b52a'], [x + 52, '#e0452b']]) { ctx.fillStyle = bc; circle(bx, cy + 20, 4.5); ctx.fill(); }
      } else {
        rect(cx - 10, cy - 24, 20, 30, '#2a4a7a');
        rect(cx - 18, cy - 24, 8, 30, '#2f6fb7'); rect(cx + 10, cy - 24, 8, 30, '#2f6fb7');
        ctx.strokeStyle = '#4f8fd6'; ctx.lineWidth = 1;
        for (let q = 0; q < 5; q++) { ctx.beginPath(); ctx.moveTo(cx - 18, cy - 20 + q * 6); ctx.lineTo(cx - 10, cy - 20 + q * 6); ctx.moveTo(cx + 10, cy - 20 + q * 6); ctx.lineTo(cx + 18, cy - 20 + q * 6); ctx.stroke(); }
      }
      return;
    }
    // plain window (lit at night) with a laundry line under it now and then
    ctx.fillStyle = S.lit ? '#ffcd6a' : '#5a2e1c'; archPath(cx, cy - 30, 22, cy + 6); ctx.fill();
    if (pick > 0.86) {
      ctx.strokeStyle = '#5a3a24'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x + 4, cy + 16); ctx.quadraticCurveTo(cx, cy + 22, x + w - 18, cy + 16); ctx.stroke();
      const cl = ['#f2f2ea', '#3a6fc4', '#ee8a2a', '#2f9a7a'];
      for (let q = 0; q < 4; q++) rect(x + 7 + q * 12, cy + 17 + (q % 2), 9, 12 + (q % 2) * 4, cl[q]);
    }
  }

  function drawObstacle(o) {
    const S = WALLS[o.world] || WALLS[0];
    const w = T.obstacleWidth;
    const top = o.gapY - o.gap / 2, bottom = o.gapY + o.gap / 2;
    const capH = 18;
    const parts = [{ y: 0, h: top, isTop: true }, { y: bottom, h: GROUND_TOP - bottom, isTop: false }];
    for (const p of parts) {
      if (p.h <= 0) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(o.x, p.y, w, p.h); ctx.clip();
      rect(o.x, p.y, w, p.h, S.body);
      rect(o.x + w - 14, p.y, 14, p.h, S.shade);
      // plaster texture: faint horizontal courses
      ctx.fillStyle = S.line;
      const dir = p.isTop ? -1 : 1, edge = p.isTop ? top : bottom;
      for (let k = 1; k < 30; k++) { const ly = edge + dir * (capH + 16 + k * 22); ctx.fillRect(o.x, ly, w - 14, 1.5); }
      band(S, o.x, p.isTop ? edge - capH - 16 : edge + capH, w, 16);
      // storeys repeat away from the gap, so the edge near the player always looks the same
      for (let k = 0; k < 5; k++) {
        const cy = edge + dir * (capH + 16 + 66 + k * 112);
        if (p.isTop ? cy < -60 : cy > GROUND_TOP + 60) break;
        if (!p.isTop && cy + 40 > GROUND_TOP - 4) {      // street level: a door instead
          if (GROUND_TOP - (edge + capH + 16) > 70) {
            ctx.fillStyle = S.feature === 'flowers' || S.feature === 'shutters' ? '#2f5fc4' : S.feature === 'kasbah' ? '#5a2e18' : '#2f5fa8';
            archPath(o.x + 29, GROUND_TOP - 54, 30, GROUND_TOP); ctx.fill();
            ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
          }
          break;
        }
        storey(S, o, k + (p.isTop ? 10 : 0), o.x, cy, w);
      }
      ctx.restore();

      // Ledge at the opening
      const capY = p.isTop ? top - capH : bottom;
      const cx0 = o.x - 6, cw = w + 12;
      if (S.cap === 'tiles') {
        // green glazed tiles, like the roofs on the sheet
        rect(cx0, capY, cw, capH, '#1f8a5a');
        ctx.fillStyle = '#2fae74';
        for (let k = 0; k < 7; k++) ctx.fillRect(cx0 + 3 + k * 12, capY + 2, 5, capH - 4);
        rect(cx0, p.isTop ? capY + capH - 4 : capY, cw, 4, '#146a44');
      } else if (S.cap === 'merlons') {
        rect(cx0, capY, cw, capH, S.light);
        ctx.fillStyle = S.shade;
        for (let k = 0; k < 6; k++) ctx.fillRect(cx0 + 4 + k * 14, p.isTop ? capY + capH - 8 : capY + 3, 8, 5);
      } else if (S.cap === 'blue') {
        rect(cx0, capY, cw, capH, '#f6f3ec'); rect(cx0, capY + 6, cw, 6, '#2f6fb7');
      } else {
        rect(cx0, capY, cw, capH, '#f3f6fb'); rect(cx0, p.isTop ? capY + 2 : capY + capH - 6, cw, 4, '#a6c8f4');
      }
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.strokeRect(o.x, p.y, w, p.h);
      ctx.strokeRect(cx0, capY, cw, capH);
    }
  }

  // ---------------------------------------------------------------------------
  // Coins and power-ups. Coins spin; power-ups float in a bubble so they stand out.
  // ---------------------------------------------------------------------------
  function starPath(cx, cy, r) {
    // the Moroccan eight-pointed star: two overlapping squares
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, b = a + Math.PI / 8;
      ctx.lineTo(cx + Math.cos(a - Math.PI / 8) * r, cy + Math.sin(a - Math.PI / 8) * r);
      ctx.lineTo(cx + Math.cos(b - Math.PI / 8) * r * 0.72, cy + Math.sin(b - Math.PI / 8) * r * 0.72);
    }
    ctx.closePath();
  }
  function drawCoin(x, y, r, spin) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(Math.max(0.18, Math.abs(Math.cos(spin))), 1);
    ctx.fillStyle = GOLD; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    circle(0, 0, r); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff2a8'; starPath(0, 0, r * 0.62); ctx.fill();
    ctx.fillStyle = '#d38a12'; circle(0, 0, r * 0.22); ctx.fill();
    ctx.restore();
  }
  function drawShieldIcon(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, -11); ctx.lineTo(9, -7.5); ctx.lineTo(9, -1);
    ctx.bezierCurveTo(9, 5, 5, 9, 0, 11); ctx.bezierCurveTo(-5, 9, -9, 5, -9, -1);
    ctx.lineTo(-9, -7.5); ctx.closePath();
    ctx.fillStyle = '#2f5fc4'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.fillStyle = GOLD; starPath(0, 0, 5); ctx.fill();
    ctx.restore();
  }
  function drawTeaGlass(x, y, s) {
    // a glass of mint tea: time to slow down
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-6.5, -7); ctx.lineTo(6.5, -7); ctx.lineTo(5, 9); ctx.lineTo(-5, 9); ctx.closePath();
    ctx.fillStyle = '#c7781e'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(-4.6, -5, 2, 11);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-6.5, -7); ctx.lineTo(6.5, -7); ctx.lineTo(5, 9); ctx.lineTo(-5, 9); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#3f9a4a';
    ctx.beginPath(); ctx.ellipse(3.5, -9.5, 5, 2.4, -0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawPickup(o) {
    const p = o.pickup;
    if (!p || p.taken) return;
    const x = o.x + T.obstacleWidth / 2;
    const bob = Math.sin(game.time * 3 + o.id) * 2.5;
    const y = p.y + bob, r = T.pickupRadius;
    if (p.type === 'coin') { drawCoin(x, y, r, game.time * 3.2 + o.id); return; }
    const pulse = 1 + Math.sin(game.time * 5) * 0.06;
    ctx.fillStyle = p.type === 'shield' ? 'rgba(120, 170, 255, 0.45)' : 'rgba(150, 220, 170, 0.5)';
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    circle(x, y, (r + 5) * pulse); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; circle(x - 7, y - 8, 3); ctx.fill();
    if (p.type === 'shield') drawShieldIcon(x, y + 1, 1.05); else drawTeaGlass(x, y + 1, 1.05);
  }

  // Short-lived flourishes: "+1" over a collected coin, sparkle rings, the shield shattering.
  // Capped so a long run can never pile them up.
  const effects = [];
  function addEffect(kind) {
    effects.push({ kind, x: game.bird.x, y: game.bird.y, t0: game.time });
    if (effects.length > 12) effects.shift();
  }
  function drawEffects() {
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i], age = game.time - e.t0, life = e.kind === 'coin' ? 0.6 : 0.45;
      if (age > life || age < 0) { effects.splice(i, 1); continue; }
      const k = age / life;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      if (e.kind === 'coin') {
        ctx.font = '800 22px "Baloo Bhaijaan 2", "Trebuchet MS", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.fillStyle = GOLD;
        ctx.strokeText('+1', e.x + 6, e.y - 24 - k * 30); ctx.fillText('+1', e.x + 6, e.y - 24 - k * 30);
      } else {
        const color = e.kind === 'shieldBreak' ? '#7fa8ff' : e.kind === 'shield' ? '#2f5fc4' : '#1f8a5a';
        ctx.strokeStyle = color; ctx.lineWidth = 4 * (1 - k) + 1;
        circle(e.x, e.y, 26 + k * 40); ctx.stroke();
        if (e.kind === 'shieldBreak') {
          ctx.fillStyle = color;
          for (let s = 0; s < 8; s++) {
            const a = s * Math.PI / 4 + 0.3, d = 30 + k * 55;
            ctx.save(); ctx.translate(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d); ctx.rotate(a + k * 4);
            ctx.fillRect(-4, -2, 8, 4); ctx.restore();
          }
        }
      }
      ctx.restore();
    }
  }
  function drawShieldBubble() {
    if (!game.shield || game.state !== 'playing' && game.state !== 'paused') return;
    const b = game.bird, r = 33 + Math.sin(game.time * 6) * 1.5;
    ctx.fillStyle = 'rgba(120, 170, 255, 0.22)';
    ctx.strokeStyle = 'rgba(47, 95, 196, 0.85)'; ctx.lineWidth = 3;
    circle(b.x, b.y - 6, r); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y - 6, r - 6, -2.4, -1.6); ctx.stroke();
  }

  // ---------------------------------------------------------------------------
  // The hero: a round little bird in a fez (or another outfit). Wings beat faster
  // right after a flap, the body tilts with speed, scarf and tassel swing.
  // ---------------------------------------------------------------------------
  function animateBird(dt) {
    const b = game.bird;
    if (game.state === 'paused') return;
    const sinceFlap = game.time - game.lastFlapAt;
    const boost = game.state === 'playing' && sinceFlap >= 0 && sinceFlap < 0.3 ? 1 - sinceFlap / 0.3 : 0;
    const speed = game.state === 'over' ? 0 : game.state === 'ready' ? 9 : 12 + 26 * boost;
    wingPhase += dt * speed * game.timeScale;
    const target = game.state === 'ready' ? -0.08 : Math.max(-0.45, Math.min(1.15, b.vy / 620));
    tilt += (target - tilt) * Math.min(1, dt * 14);
    // drawn bigger on the title screen, shrinking smoothly to play size when a run starts
    const landscape = canvas.width > canvas.height * 1.2;
    const goal = game.state === 'ready' ? (landscape ? 1.45 : 1.9) : 1;
    heroScale += (goal - heroScale) * Math.min(1, dt * (game.state === 'ready' ? 6 : 12));
  }

  // Draws the bird centred on (0, 0) of context c, facing right. `wing` is the wing angle, `t` the time.
  function drawBird(c, kind, wing, t) {
    const O = OUTFITS[kind] || OUTFITS.classic;
    c.lineJoin = 'round'; c.lineCap = 'round';
    const sway = Math.sin(t * 7) * 3;
    // scarf ends streaming behind
    c.strokeStyle = INK; c.lineWidth = 2;
    for (const [dy, col, len] of [[2, O.scarf2, 26], [-2, O.scarf, 30]]) {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(-6, 9 + dy);
      c.quadraticCurveTo(-18, 6 + dy + sway, -len, 9 + dy - sway);
      c.lineTo(-len + 2, 15 + dy - sway);
      c.quadraticCurveTo(-18, 13 + dy + sway, -5, 14 + dy);
      c.closePath(); c.fill(); c.stroke();
    }
    // tail feathers
    c.fillStyle = O.back; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-13, -2); c.lineTo(-24, -6); c.lineTo(-21, 1); c.lineTo(-25, 5); c.lineTo(-13, 6); c.closePath(); c.fill(); c.stroke();
    // far wing, behind the body
    c.save(); c.translate(-2, 0); c.rotate(-wing * 0.7 - 0.3);
    c.fillStyle = O.wingEdge; c.lineWidth = 2;
    c.beginPath(); c.ellipse(-8, -6, 11, 6, -0.3, 0, TAU); c.fill(); c.stroke();
    c.restore();
    // body
    c.fillStyle = O.body;
    c.beginPath(); c.arc(0, 0, 16.5, 0, TAU); c.fill();
    c.save();
    c.beginPath(); c.arc(0, 0, 16.5, 0, TAU); c.clip();
    c.fillStyle = O.back; c.beginPath(); c.ellipse(-9, -4, 10, 16, 0.3, 0, TAU); c.fill();
    c.fillStyle = O.belly;
    c.beginPath(); c.ellipse(6, 8, 12, 10, -0.2, 0, TAU); c.fill();        // belly
    c.beginPath(); c.ellipse(8, -3, 10, 9, 0, 0, TAU); c.fill();           // face
    c.restore();
    c.strokeStyle = INK; c.lineWidth = 2.6;
    c.beginPath(); c.arc(0, 0, 16.5, 0, TAU); c.stroke();
    // scarf knot round the neck
    c.fillStyle = O.scarf; c.lineWidth = 2;
    c.beginPath(); c.ellipse(1, 11, 11, 4, -0.15, 0, TAU); c.fill(); c.stroke();
    // eyes: big and shiny, the far one a little smaller
    for (const [ex, ey, rx, ry, px, pr] of [[3, -4.5, 4.4, 5.4, 4.4, 2.8], [11, -4, 5.4, 6.4, 12.6, 3.4]]) {
      c.fillStyle = '#ffffff'; c.lineWidth = 1.5;
      c.beginPath(); c.ellipse(ex, ey, rx, ry, 0, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = INK; c.beginPath(); c.arc(px, ey + 0.6, pr, 0, TAU); c.fill();
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(px + 1.1, ey - 0.8, pr * 0.38, 0, TAU); c.fill();
    }
    // beak
    c.fillStyle = '#f59a23'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(14.5, -0.5); c.quadraticCurveTo(22, 0, 25, 3); c.quadraticCurveTo(21, 6.5, 14.5, 6); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#b8620e'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(16, 3.2); c.lineTo(23, 3.2); c.stroke();
    // blush
    c.fillStyle = 'rgba(240, 110, 100, 0.45)'; c.beginPath(); c.ellipse(15, 8, 3, 1.8, 0, 0, TAU); c.fill();
    // near wing
    c.save(); c.translate(-3, 3); c.rotate(-wing);
    c.fillStyle = O.wing; c.strokeStyle = INK; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(4, -3); c.quadraticCurveTo(-10, -12, -20, -4); c.quadraticCurveTo(-14, 2, -16, 5); c.quadraticCurveTo(-6, 8, 4, 4); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = O.wingEdge; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(-6, -1); c.lineTo(-14, 0); c.moveTo(-4, 2); c.lineTo(-11, 4); c.stroke();
    c.restore();
    // little orange feet
    c.fillStyle = '#f59a23'; c.strokeStyle = INK; c.lineWidth = 1.5;
    for (const fx of [-1, 5]) { c.beginPath(); c.ellipse(fx, 17.5, 3, 2, 0, 0, TAU); c.fill(); c.stroke(); }
    // headwear
    c.save(); c.translate(3, -14); c.rotate(-0.12);
    c.strokeStyle = INK; c.lineWidth = 2.4;
    if (O.hat === 'fez' || O.hat === 'crown') {
      c.fillStyle = O.hatC;
      c.beginPath(); c.moveTo(-9.5, 3); c.lineTo(-7, -13); c.lineTo(7, -13); c.lineTo(9.5, 3); c.closePath(); c.fill();
      c.fillStyle = O.hatDark; c.beginPath(); c.moveTo(3.5, -13); c.lineTo(7, -13); c.lineTo(9.5, 3); c.lineTo(5, 3); c.closePath(); c.fill();
      if (O.band) { c.fillStyle = O.band; c.fillRect(-9, -2, 18, 3.4); }
      c.beginPath(); c.moveTo(-9.5, 3); c.lineTo(-7, -13); c.lineTo(7, -13); c.lineTo(9.5, 3); c.closePath(); c.stroke();
      c.fillStyle = O.hatTop; c.beginPath(); c.ellipse(0, -13, 7, 2.2, 0, 0, TAU); c.fill(); c.stroke();
      if (O.hat === 'crown') {
        c.fillStyle = GOLD; c.lineWidth = 1.8;
        c.beginPath(); c.moveTo(-9, 1); c.lineTo(-9, -5); c.lineTo(-5, -2); c.lineTo(0, -8); c.lineTo(5, -2); c.lineTo(9, -5); c.lineTo(9, 1); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = O.gem; c.beginPath(); c.arc(0, -2, 2, 0, TAU); c.fill(); c.stroke();
      }
      // tassel swinging behind
      const ts = Math.sin(t * 6) * 2.5;
      c.strokeStyle = O.tassel; c.lineWidth = 1.8;
      c.beginPath(); c.moveTo(0, -14); c.quadraticCurveTo(-8, -17, -11 + ts * 0.3, -6 + ts); c.stroke();
      c.fillStyle = O.tassel; c.strokeStyle = INK; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-12.4 + ts * 0.3, -7 + ts); c.lineTo(-9.8 + ts * 0.3, -7 + ts); c.lineTo(-9 + ts * 0.3, -0.5 + ts); c.lineTo(-13.2 + ts * 0.3, -0.5 + ts); c.closePath(); c.fill(); c.stroke();
    } else if (O.hat === 'turban' || O.hat === 'wrap') {
      // cloth tail flowing back
      c.fillStyle = O.hatDark; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-6, 0); c.quadraticCurveTo(-16, -2 + sway, -22, 4 - sway); c.lineTo(-19, 9 - sway); c.quadraticCurveTo(-12, 5, -5, 5); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = O.hatC; c.lineWidth = 2.4;
      c.beginPath(); c.ellipse(0, -2, 12, 7, 0, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(1, -8, 9, 6, 0.1, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = O.hatDark; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(-10, -1); c.quadraticCurveTo(0, -7, 11, -3); c.moveTo(-7, -8); c.quadraticCurveTo(2, -12, 9, -7); c.stroke();
      if (O.dots) { c.fillStyle = O.dots; for (const [dx, dy] of [[-5, -3], [4, -1], [-1, -9], [6, -8], [-7, 1]]) { c.beginPath(); c.arc(dx, dy, 1.1, 0, TAU); c.fill(); } }
    } else if (O.hat === 'hood') {
      // a djellaba hood with a point that falls back, sprinkled with golden stars
      c.fillStyle = O.hatC; c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(-12, 6); c.quadraticCurveTo(-11, -10, 2, -11); c.quadraticCurveTo(10, -10, 12, 3);
      c.quadraticCurveTo(0, -3, -12, 6); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-6, -9); c.quadraticCurveTo(-16, -10 + sway * 0.5, -22, 0 + sway); c.quadraticCurveTo(-15, -2, -11, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = O.stars;
      for (const [dx, dy, r] of [[-4, -5, 1.8], [5, -6, 1.5], [-15, -2, 1.4], [8, -1, 1.2]]) {
        c.beginPath(); for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5 - Math.PI / 2, rr = k % 2 ? r * 0.45 : r; c.lineTo(dx + Math.cos(a) * rr, dy + Math.sin(a) * rr); } c.closePath(); c.fill();
      }
    }
    c.restore();
  }

  function heroLift() { return (heroScale - 1) * 46; }
  function drawHero() {
    const b = game.bird;
    const wing = game.state === 'over' ? -0.2 : Math.sin(wingPhase) * 0.8;
    ctx.save();
    // On the title screen the bird is drawn bigger and a little lower (clear of the logo); both ease
    // back to normal as the run starts. Drawing only: the bird's real position never changes.
    ctx.translate(b.x, b.y + heroLift());
    ctx.rotate(tilt);
    if (heroScale !== 1) ctx.scale(heroScale, heroScale);
    drawBird(ctx, progress.selected, wing, game.time);
    ctx.restore();
  }

  function draw() {
    const W = canvas.width / scale;
    ctx = mainCtx;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (blendK < 1 && sceneFrom !== sceneWorld) {
      // old place underneath, new place fading in on top (both complete scenes, so nothing pops)
      drawScene(sceneFrom, W);
      // The incoming scene is drawn at half resolution: it's moving and see-through while it fades in,
      // so nobody sees the softness, and it halves the extra work on older phones.
      const fw = Math.ceil(canvas.width / 2), fh = Math.ceil(canvas.height / 2);
      if (fade.width !== fw || fade.height !== fh) { fade.width = fw; fade.height = fh; }
      ctx = fadeCtx;
      ctx.setTransform(scale / 2, 0, 0, scale / 2, 0, 0);
      drawScene(sceneWorld, W);
      ctx = mainCtx;
      const k = blendK * blendK * (3 - 2 * blendK);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = k;
      ctx.drawImage(fade, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    } else {
      drawScene(sceneWorld, W);
    }
    for (const o of game.obstacles) drawObstacle(o);
    for (const o of game.obstacles) drawPickup(o);
    // While the shield's grace period runs, the bird blinks: "you're safe for a moment"
    const blink = game.grace > 0 && Math.floor(game.time * 14) % 2 === 0;
    if (blink) ctx.globalAlpha = 0.35;
    drawHero();
    ctx.globalAlpha = 1;
    drawShieldBubble();
    drawEffects();
    // Slow motion: a warm wash over the whole scene, strongest at full slow-down
    const slowAmt = (1 - game.timeScale) / (1 - T.slowFactor);
    if (slowAmt > 0.01) {
      ctx.fillStyle = `rgba(255, 196, 120, ${0.16 * slowAmt})`;
      ctx.fillRect(0, 0, W, T.worldHeight);
    }
  }

  // ---------------------------------------------------------------------------
  // Overlays follow the game state
  // ---------------------------------------------------------------------------
  // Coins are saved the moment they're collected, so closing the browser mid-run loses none.
  let trackedRun = -1, savedRunCoins = 0, runStartBest = progress.best;
  function saveRunCoins() {
    if (game.run !== trackedRun) { trackedRun = game.run; savedRunCoins = 0; runStartBest = progress.best; }
    const extra = game.coinsThisRun - savedRunCoins;
    if (extra > 0) { progress.addCoins(extra); savedRunCoins = game.coinsThisRun; }
  }

  function showStats() {
    ui.bestPill.hidden = progress.best === 0;
    ui.bestReady.textContent = String(progress.best);
    ui.coinsReady.textContent = String(progress.coins);
  }

  let shownState = null, shownScore = -1, shownCoins = -1, shownSlow = '', shownShield = null, shownBest = -1;
  const RING = 2 * Math.PI * 12;
  function syncUI() {
    if (game.score !== shownScore) { shownScore = game.score; ui.score.textContent = String(game.score); }
    if (progress.coins !== shownCoins) { shownCoins = progress.coins; ui.hudCoinN.textContent = String(progress.coins); }
    const best = Math.max(progress.best, game.state === 'playing' || game.state === 'paused' ? game.score : 0);
    if (best !== shownBest) { shownBest = best; ui.hudBestN.textContent = String(best); }
    // Power-up indicators
    if (game.shield !== shownShield) { shownShield = game.shield; ui.pwShield.hidden = !game.shield; }
    const slowOn = game.slowLeft > 0;
    ui.pwSlow.hidden = !slowOn;
    if (slowOn) {
      const label = String(Math.ceil(game.slowLeft));
      if (label !== shownSlow) { shownSlow = label; ui.slowLeft.textContent = label; }
      ui.slowRing.setAttribute('stroke-dashoffset', String(RING * (1 - game.slowLeft / T.slowDuration)));
    }
    const s = game.state;
    ui.again.disabled = s === 'over' && !game.canRestart();
    if (s === shownState) return;
    const was = shownState;
    shownState = s;
    const inRun = s === 'playing' || s === 'paused';
    ui.ready.hidden = s !== 'ready' || shopIsOpen;
    ui.lang.hidden = s !== 'ready' || shopIsOpen;   // language is chosen on the title screen only
    ui.pause.hidden = s !== 'playing';
    ui.sound.hidden = s === 'playing';               // in a run the corner shows the pause button and best score instead
    ui.paused.hidden = s !== 'paused';
    ui.over.hidden = s !== 'over';
    ui.score.hidden = !inRun;
    ui.hudRight.hidden = s !== 'playing';
    ui.powers.hidden = !inRun;
    if (s === 'ready') showStats();
    if (s === 'over') {
      saveRunCoins();
      progress.recordBest(game.score);
      ui.final.textContent = String(game.score);
      ui.newBest.hidden = !(game.score > runStartBest);
      ui.bestOver.textContent = String(progress.best);
      ui.coinsOver.textContent = '+' + game.coinsThisRun;
      ui.again.focus({ preventScroll: true });
    } else if (was === 'over' || was === 'ready') {
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    }
  }

  // ---------------------------------------------------------------------------
  // Shop (Phase 5; six outfits since Phase 6). Outfits change looks only, never how the bird flies.
  // ---------------------------------------------------------------------------
  let shopIsOpen = false;
  var shopBuilt = false;          // 'var' so the language code above can safely check it before this runs
  const cards = CHARACTERS.map((ch) => {
    const card = document.createElement('div');
    card.className = 'card';
    const cv = document.createElement('canvas');
    cv.setAttribute('aria-hidden', 'true');
    const name = document.createElement('div');
    name.className = 'name';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'small-btn';
    const need = document.createElement('div');
    need.className = 'need';
    card.append(cv, name, btn, need);
    ui.shopGrid.append(card);
    btn.addEventListener('click', () => shopAction(ch.id));
    return { ch, card, cv, cx: cv.getContext('2d'), name, btn, need };
  });

  shopBuilt = true;

  function shopAction(id) {
    sound.unlock();
    if (progress.owns(id)) {
      if (progress.selected !== id && progress.select(id)) sound.play('choose');
    } else {
      // buy() checks "already owned" and "enough coins" itself, so a double tap charges once
      if (progress.buy(id) === 'bought') { progress.select(id); sound.play('buy'); }
    }
    renderShop();
  }

  function renderShop() {
    const t = TEXT[settings.lang];
    ui.shopCoins.textContent = String(progress.coins);
    for (const c of cards) {
      const id = c.ch.id, owned = progress.owns(id), chosen = progress.selected === id;
      c.name.textContent = t.names[id];
      c.name.classList.toggle('long', t.names[id].length > 9);
      c.card.classList.toggle('chosen', chosen);
      c.btn.classList.toggle('buy', !owned);
      if (chosen) {
        c.btn.textContent = t.chosen;
        c.btn.disabled = true;
        c.need.textContent = '';
      } else if (owned) {
        c.btn.textContent = t.choose;
        c.btn.disabled = false;
        c.need.textContent = '';
      } else {
        c.btn.replaceChildren(document.createTextNode(t.buy + ' '), Object.assign(document.createElement('i'), { className: 'coin-ico' }),
          document.createTextNode(String(c.ch.price)));
        const short = c.ch.price - progress.coins;
        c.btn.disabled = short > 0;
        c.need.textContent = short > 0 ? t.need(short) : '';
      }
      c.btn.setAttribute('aria-label', `${t.names[id]}: ${c.btn.textContent.replace(/\s+/g, ' ').trim()}`);
    }
  }

  function drawPreviews() {
    for (const c of cards) {
      const w = c.cv.clientWidth, h = c.cv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (!w || !h) continue;
      if (c.cv.width !== Math.round(w * dpr) || c.cv.height !== Math.round(h * dpr)) { c.cv.width = Math.round(w * dpr); c.cv.height = Math.round(h * dpr); }
      const k = Math.min(c.cv.height / 64, c.cv.width / 64);   // the bird and its hat fit in about 64 units
      c.cx.setTransform(1, 0, 0, 1, 0, 0);
      c.cx.clearRect(0, 0, c.cv.width, c.cv.height);
      c.cx.setTransform(k, 0, 0, k, c.cv.width / 2 + 1 * k, c.cv.height / 2 + 6 * k);
      c.cx.globalAlpha = progress.owns(c.ch.id) ? 1 : 0.9;
      drawBird(c.cx, c.ch.id, Math.sin(game.time * 9 + c.ch.price) * 0.6, game.time + c.ch.price);
      c.cx.globalAlpha = 1;
    }
  }

  function openShop() {
    if (game.state !== 'ready' || shopIsOpen) return;
    shopIsOpen = true;
    renderShop();
    ui.shop.hidden = false;
    ui.ready.hidden = true;
    ui.lang.hidden = true;
    ui.shopClose.focus({ preventScroll: true });
  }
  function closeShop() {
    if (!shopIsOpen) return;
    shopIsOpen = false;
    ui.shop.hidden = true;
    ui.ready.hidden = game.state !== 'ready';
    ui.lang.hidden = game.state !== 'ready';
    showStats();
    ui.shopOpen.focus({ preventScroll: true });
  }
  ui.shopOpen.addEventListener('click', () => { sound.unlock(); openShop(); });
  ui.shopClose.addEventListener('click', closeShop);

  // When the place changes, fade to the new scene and show its name briefly.
  let shownWorld = 0;
  function syncWorld(nowSec) {
    if (game.world === shownWorld) return;
    shownWorld = game.world;
    const inRun = game.state === 'playing' || game.state === 'paused';
    startBlend(game.world, inRun ? 1.5 : 1, nowSec);
    if (inRun) {
      ui.worldName.textContent = TEXT[settings.lang].worlds[game.world];
      ui.worldName.classList.remove('show');
      void ui.worldName.offsetWidth;          // restart the animation
      ui.worldName.classList.add('show');
    }
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------
  // ---------------------------------------------------------------------------
  // Installing the game as an app (Phase 7). Android and computer browsers offer an install
  // prompt the page can open; iPhone and iPad have none, so there the button explains the two taps.
  // Hidden once the game already runs as an installed app.
  // ---------------------------------------------------------------------------
  function runningAsApp() {
    try {
      return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
    } catch (e) { return false; }
  }
  const appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installPrompt = null;
  let installMode = !runningAsApp() && appleTouch ? 'ios' : null;   // 'prompt' | 'ios' | null
  function syncInstall() {
    ui.install.hidden = !installMode || runningAsApp();
    if (ui.install.hidden) ui.installHint.hidden = true;
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();                 // keep the browser's own banner away; our button opens it
    installPrompt = e; installMode = 'prompt';
    syncInstall();
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; installMode = null; syncInstall(); });
  ui.install.addEventListener('click', async () => {
    sound.unlock();
    if (installMode === 'ios') { ui.installHint.hidden = !ui.installHint.hidden; return; }
    const p = installPrompt;
    if (!p) return;
    installPrompt = null; installMode = null;   // a prompt can be used once; the browser offers a new one later if needed
    try { await p.prompt(); } catch (e) { /* closed or not allowed: nothing to do */ }
    syncInstall();
  });
  syncInstall();

  // Offline play (Phase 7): a small helper (sw.js) keeps a copy of the game on the device.
  // Only on the real web address; never inside the Claude preview frame or a local file.
  try {
    const okHost = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ('serviceWorker' in navigator && okHost && window.top === window) {
      const register = () => navigator.serviceWorker.register('sw.js').catch(() => {});
      if (document.readyState === 'complete') register(); else window.addEventListener('load', register);
    }
  } catch (e) { /* offline support is a bonus; the game never depends on it */ }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    game.step(dt);
    for (const e of game.takeEvents()) {
      sound.play(e);
      if (e === 'coin' || e === 'shield' || e === 'slow' || e === 'shieldBreak') addEffect(e);
    }
    saveRunCoins();
    syncWorld(now / 1000);
    updateBlend(now / 1000);
    animateBird(dt);
    draw();
    if (shopIsOpen) drawPreviews();
    syncUI();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((now) => { last = now; frame(now); });
})();
</script>
</body>
</html>
