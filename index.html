<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bellarej</title>
<!-- APP-HEAD:START (installable app, Phase 7; left out of the Claude preview copy) -->
<meta name="description" content="Fly a little bird in a fez through Marrakech, Fès, Chefchaouen, the desert, the coast and the night.">
<meta name="theme-color" content="#2f86d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bellarej">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/baloo-bhaijaan-2.woff" as="font" type="font/woff" crossorigin>
<!-- APP-HEAD:END -->
<style>
  /* FONT:START  The font ships with the game (OFL licence, see fonts/OFL.txt) so it also works offline. */
  @font-face {
    font-family: "Baloo Bhaijaan 2";
    src: url("fonts/baloo-bhaijaan-2.woff") format("woff");
    font-weight: 600 800; font-style: normal; font-display: swap;
  }
  /* FONT:END */
  /* Phase 6 look, taken from the owner's design sheet: warm Moroccan light, a chunky golden logo,
     cream "parchment" panels with dark-brown outlines, dark glass buttons over the game.
     One deliberate look, the same on light and dark hosts. */
  :root {
    color-scheme: light;
    --ink: #2b160b;            /* every outline */
    --cream: #f8ecd6;          /* panels */
    --cream-deep: #efdcbc;
    --label: #e6d1ae;          /* name tags in the shop */
    --brown: #6b3a1e;
    --clay: #c8643a;
    --red: #c4222a;
    --gold: #f5b52a;
    --gold-hi: #ffe27a;
    --orange: #ee7d1a;
    --green: #1f8a5a;
    --majorelle: #2f5fc4;
    --glass: rgba(28, 16, 8, 0.55);
    --font-display: "Baloo Bhaijaan 2", "Trebuchet MS", system-ui, sans-serif;
  }
  [hidden] { display: none !important; } /* hidden panels must never catch taps */
  html, body { margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0;
    background: #2f86d6;
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative; height: 100%; width: 100%;
    touch-action: none; cursor: pointer;
    background: linear-gradient(#2f86d6, #f7dcb0);
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
    padding-inline: 16px;
    text-align: center;
  }
  button { font: inherit; pointer-events: auto; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px var(--ink); }

  /* Big score in the middle, white with a dark outline (as on the sheet) */
  #score {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0;
    text-align: center;
    font-size: 66px; font-weight: 800; line-height: 1;
    color: #fff;
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--ink);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  /* Dark glass buttons in the corners: pause (in a run), sound and language (menus).
     inset-inline-* flips them to the other side in Arabic. */
  .corner {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px);
    min-width: 46px; height: 46px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 17px; font-weight: 800; line-height: 1;
    color: #fff; background: var(--glass);
    border: 2.5px solid rgba(255, 255, 255, 0.9); border-radius: 13px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    z-index: 3;
  }
  .corner:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
  #sound { inset-inline-end: 14px; padding: 0; width: 46px; }
  #lang { inset-inline-start: 14px; }
  #pause { inset-inline-start: 14px; padding: 0; width: 46px; }
  .corner svg { width: 24px; height: 24px; }
  #sound[aria-pressed="true"] .on, #sound[aria-pressed="false"] .off { display: none; }

  /* ---------------- Title screen ---------------- */
  #ready {
    justify-content: space-between;
    padding-block: calc(env(safe-area-inset-top, 0px) + 74px) calc(env(safe-area-inset-bottom, 0px) + 30px);
  }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 0; width: 100%; }
  #ready h1 { margin: 0; width: min(92vw, 470px); line-height: 0; }
  #logo-svg {
    width: 100%; height: auto; max-height: 21vh; overflow: visible;   /* keeps the big title bird clear of the logo */
    filter: drop-shadow(0 5px 0 rgba(43, 22, 11, 0.55));
  }
  #logo-svg text {
    font-family: var(--font-display); font-weight: 800; font-size: 120px;
    fill: url(#logo-fill); stroke: var(--ink); stroke-width: 15px; stroke-linejoin: round;
    paint-order: stroke fill;
  }
  .ribbon {
    position: relative; margin-top: -4px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 3px 22px 4px;
    font-size: clamp(15px, 4.4vw, 21px); font-weight: 800; line-height: 1.25;
    color: #fff3dc; background: #4a2412;
    border: 2.5px solid var(--gold); border-radius: 8px;
    box-shadow: 0 3px 0 var(--ink), inset 0 0 0 2px #4a2412, inset 0 0 0 3.5px #8a5a22;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  :lang(ar) .ribbon { letter-spacing: 0; text-transform: none; }
  .ribbon .orn { width: 12px; height: 12px; flex: none; }

  .menu { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #play {
    background: none; border: 0; padding: 4px 18px;
    font-size: clamp(30px, 8.6vw, 40px); font-weight: 800; line-height: 1.15;
    color: #fff;
    -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--ink);
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  #play span { display: inline-block; animation: breathe 1.6s ease-in-out infinite; }
  :lang(ar) #play { letter-spacing: 0; text-transform: none; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  .tile-star { width: 34px; height: 34px; margin-top: -6px; filter: drop-shadow(0 2px 0 var(--ink)); }
  .hint {
    margin: 0; display: none;
    font-size: 16px; font-weight: 600;
    color: #fff; background: var(--glass);
    padding: 2px 14px; border-radius: 999px;
  }
  @media (hover: hover) and (pointer: fine) { .hint { display: block; } }
  /* Install the game as an app (Phase 7) */
  .install-btn { font-size: 16px; padding: 3px 18px; color: #fff; background: var(--glass); border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
  .install-btn svg { width: 18px; height: 18px; }
  .install-hint {
    margin: 0; max-width: 300px; pointer-events: auto; cursor: default;
    display: flex; align-items: center; gap: 8px; text-align: start;
    font-size: 15px; font-weight: 600; line-height: 1.35;
    color: var(--ink); background: var(--cream);
    border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 12px;
    box-shadow: 0 3px 0 var(--ink);
  }
  .install-hint svg { width: 22px; height: 22px; flex: none; color: var(--majorelle); }

  /* Pills: best score with a crown, coins */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 13px;
    font-size: 20px; font-weight: 800; line-height: 1;
    color: #fff; background: var(--glass);
    border: 2.5px solid rgba(255, 255, 255, 0.85); border-radius: 12px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pill .lbl { font-weight: 600; font-size: 16px; }
  .crown { width: 24px; height: 20px; flex: none; }
  .coin-ico {
    display: inline-block; flex: none;
    width: 19px; height: 19px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2a8, #f5b52a 55%, #d38a12);
    border: 2.5px solid var(--ink);
    box-sizing: border-box;
  }
  .small-btn {
    font-size: 19px; font-weight: 800; line-height: 1.2;
    color: var(--ink); background: var(--cream);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 26px;
    box-shadow: 0 4px 0 var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .small-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .small-btn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: 0 4px 0 var(--ink); }
  .small-btn svg { width: 22px; height: 22px; flex: none; }
  .big {
    font-size: 24px; font-weight: 800; line-height: 1.2;
    color: #fff; background: linear-gradient(#ffcf4a, var(--orange));
    -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 7px 36px;
    box-shadow: 0 5px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, 0.45);
    transition: transform 0.08s, opacity 0.2s;
  }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
  .big:disabled { opacity: 0.5; cursor: default; }

  /* ---------------- In a run ---------------- */
  #hud-right {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); inset-inline-end: 14px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    pointer-events: none; z-index: 1;
  }
  #hud-right .pill { height: 36px; font-size: 19px; padding: 0 11px; }
  #powers {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 92px); left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; pointer-events: none;
  }
  #powers .pill { height: 40px; padding: 0 12px 0 6px; }
  #powers svg { width: 28px; height: 28px; flex: none; }
  #slow-ring { transition: stroke-dashoffset 0.1s linear; }

  #paused { justify-content: center; gap: 8px; background: rgba(28, 16, 8, 0.45); }
  #paused h2 { margin: 0; font-size: 48px; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  #paused .note { margin: 0; font-size: 19px; font-weight: 600; color: #fff; background: var(--glass); padding: 2px 16px; border-radius: 999px; }

  /* ---------------- Parchment panels (game over, shop) ---------------- */
  #over { justify-content: center; }
  .panel {
    pointer-events: auto; cursor: default;
    background: var(--cream);
    border: 3px solid var(--ink); border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink), inset 0 0 0 5px var(--cream), inset 0 0 0 6.5px rgba(107, 58, 30, 0.35);
    padding: 16px 26px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: min(270px, 100%);
    box-sizing: border-box;
  }
  /* Headings framed by small ornaments: —◆ TITLE ◆— */
  .orn-title {
    margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 26px; font-weight: 800; line-height: 1.2; color: var(--ink);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  :lang(ar) .orn-title { letter-spacing: 0; text-transform: none; }
  .orn-title::before, .orn-title::after {
    content: ""; flex: none; width: 34px; height: 12px;
    background:
      linear-gradient(var(--brown), var(--brown)) center / 100% 2px no-repeat,
      linear-gradient(45deg, transparent 32%, var(--brown) 33%, var(--brown) 67%, transparent 68%) center / 10px 10px no-repeat;
  }
  .label { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brown); margin-top: 6px; }
  /* Arabic letters must stay joined: no letter-spacing, no case change */
  :lang(ar) .label { letter-spacing: 0; text-transform: none; font-size: 17px; }
  #final { font-size: 58px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--clay); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  #again { margin-top: 16px; }
  .panel .row { display: flex; gap: 26px; justify-content: center; margin-top: 4px; }
  .panel .num { font-size: 28px; font-weight: 800; line-height: 1.1; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .badge {
    margin-top: 6px; padding: 2px 12px; border-radius: 999px;
    font-size: 16px; font-weight: 800; color: #fff; background: var(--red);
    border: 2px solid var(--ink);
  }

  /* Character shop (Phase 5, six outfits since Phase 6) */
  #shop {
    justify-content: center;
    pointer-events: auto; cursor: default;
    background: rgba(28, 16, 8, 0.45);
    padding-block: calc(env(safe-area-inset-top, 0px) + 70px) 16px;
  }
  #shop .panel {
    width: min(560px, 100%); max-height: 100%; overflow-y: auto;
    padding: 12px 12px 16px; gap: 10px;
  }
  .shop-head { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; padding-inline: 4px; box-sizing: border-box; }
  .shop-head .pill { color: var(--ink); background: var(--cream-deep); border-color: var(--ink); box-shadow: none; height: 34px; }
  .shop-grid {
    display: grid; width: 100%; gap: 8px 6px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 4px 4px 8px; min-width: 0;
    border: 2.5px solid transparent; border-radius: 16px;
  }
  .card.chosen { border-color: var(--ink); background: #fff7e6; }
  .card canvas {
    width: 100%; max-width: 120px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 55%, #fff8ea 0%, #f4e2c3 70%, transparent 71%);
  }
  .card .name {
    font-size: 15px; font-weight: 800; line-height: 1.3;
    background: var(--label); border-radius: 999px; padding: 1px 10px;
    max-width: 100%; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .name.long { font-size: 12px; padding-inline: 4px; line-height: 1.6; letter-spacing: -0.01em; }   /* "Chefchaouen" fits whole */
  .card .small-btn { font-size: 16px; padding: 2px 10px; min-height: 40px; width: 100%; max-width: 128px; gap: 5px; }
  .card .small-btn.buy { color: #fff; background: var(--majorelle); }
  .card .small-btn .coin-ico { width: 16px; height: 16px; border-width: 2px; }
  .card .need { font-size: 12.5px; font-weight: 600; color: var(--brown); min-height: 2.5em; line-height: 1.25; }

  /* World name, shown briefly when the place changes */
  #world-name {
    position: absolute; top: 28%; left: 0; right: 0; text-align: center;
    font-size: 42px; font-weight: 800; color: #fff;
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--ink);
    pointer-events: none; opacity: 0;
  }
  #world-name.show { animation: worldname 1.8s ease-out forwards; }
  @keyframes worldname {
    0% { opacity: 0; transform: translateY(10px) scale(0.9); }
    15%, 70% { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* Short screens (phone on its side): logo smaller, menu in one row, shop in one row */
  @media (max-height: 520px) {
    #ready { padding-block: calc(env(safe-area-inset-top, 0px) + 10px) 16px; }
    #ready h1 { width: min(52vw, 330px); }
    #logo-svg { max-height: 34vh; }
    .ribbon { font-size: 15px; padding: 1px 16px 2px; }
    #ready .menu { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; }
    #ready .stats { margin: 0; }
    #play { font-size: 30px; }
    .tile-star { display: none; }
    #ready .hint { flex-basis: 100%; max-width: max-content; }
    #shop { padding-top: 10px; padding-bottom: 10px; padding-inline: 72px; }   /* clear of the round buttons */
    #shop .panel { width: min(820px, 100%); padding: 8px 10px 10px; gap: 6px; }
    .orn-title { font-size: 22px; }
    .shop-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .card canvas { height: 60px; }
    .card .need { font-size: 11.5px; }
    #score { font-size: 54px; top: 8px; }
    #powers { top: 74px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .big { transition: none; }
    #play span { animation: none; }
    #world-name.show { animation-name: worldname-fade; }
    @keyframes worldname-fade { 0%, 100% { opacity: 0; } 15%, 70% { opacity: 1; } }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- the eight-pointed Moroccan star, reused as a small ornament -->
    <symbol id="i-star" viewBox="-10 -10 20 20">
      <path d="M0-9.5 2.7-6.5 6.7-6.7 6.5-2.7 9.5 0 6.5 2.7 6.7 6.7 2.7 6.5 0 9.5-2.7 6.5-6.7 6.7-6.5 2.7-9.5 0-6.5-2.7-6.7-6.7-2.7-6.5Z" fill="#f5b52a" stroke="#2b160b" stroke-width="1.6" stroke-linejoin="round"/>
      <circle r="2.6" fill="#c4222a" stroke="#2b160b" stroke-width="1.2"/>
    </symbol>
    <symbol id="i-crown" viewBox="0 0 24 20">
      <path d="M2.5 6.5 7.5 11 12 3.5 16.5 11 21.5 6.5 19.5 17h-15Z" fill="#f5b52a" stroke="#2b160b" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="12" cy="3.4" r="1.6" fill="#ffe27a"/><rect x="4.5" y="14" width="15" height="2.4" fill="#d38a12"/>
    </symbol>
  </defs>
</svg>
<div id="stage" aria-label="Bellarej">
  <canvas id="game"></canvas>
  <div id="score" aria-live="off" hidden>0</div>
  <div id="hud-right" hidden>
    <span id="hud-best" class="pill"><svg class="crown" aria-hidden="true"><use href="#i-crown"/></svg><span id="hud-best-n">0</span></span>
    <span id="hud-coins" class="pill"><i class="coin-ico"></i><span id="hud-coin-n">0</span></span>
  </div>
  <div id="world-name" aria-live="polite"></div>
  <div id="powers" hidden>
    <div id="pw-shield" class="pill" hidden>
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3l9 3.5v6.5c0 6-4 10-9 12-5-2-9-6-9-12V6.5z" fill="#2f5fc4" stroke="#2b160b" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 9l1.6 3.4 3.4.4-2.5 2.4.7 3.4L14 17l-3.2 1.6.7-3.4-2.5-2.4 3.4-.4z" fill="#f5b52a"/></svg>
      <span data-t="shield"></span>
    </div>
    <div id="pw-slow" class="pill" hidden>
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="12" fill="#fffaf0" stroke="#e9dcc4" stroke-width="3"/>
        <circle id="slow-ring" cx="14" cy="14" r="12" fill="none" stroke="#1f8a5a" stroke-width="3" stroke-linecap="round" stroke-dasharray="75.4" stroke-dashoffset="0" transform="rotate(-90 14 14)"/>
        <path d="M9.5 9h9l-1.4 10.5h-6.2z" fill="#c7781e" stroke="#2b160b" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M14.5 9c1-2.6 3.4-3.2 4.6-2.4-1 1.6-2.6 2.4-4.6 2.4z" fill="#3f9a4a"/>
      </svg>
      <span id="slow-left">5</span>
    </div>
  </div>

  <button id="pause" class="corner" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/></svg>
  </button>
  <button id="sound" class="corner" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
      <g class="on"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
      <g class="off"><path d="M17 9l5 6M22 9l-5 6"/></g>
    </svg>
  </button>
  <button id="lang" class="corner" type="button"></button>

  <div class="overlay" id="ready">
    <div class="logo">

<script>
// Bellarej core game logic. No DOM, no drawing: pure state + rules, so it can be tested on its own.
// World units: the world is always 640 units tall; its width follows the screen shape.
// Time is in seconds.

const TUNING = {
  worldHeight: 640,
  groundHeight: 84,
  gravity: 1500,          // how fast the stork falls
  flapVelocity: -470,     // upward speed right after a flap
  maxFallSpeed: 720,
  scrollSpeed: 150,       // how fast obstacles move left
  obstacleWidth: 72,
  gapSize: 170,           // height of the opening to fly through
  obstacleSpacing: 240,   // horizontal distance between obstacles
  firstObstacleAhead: 360,// distance from the stork to the first obstacle
  gapMargin: 70,          // min distance between a gap and the top / ground
  maxGapShift: 200,       // max vertical jump between two consecutive gaps (keeps it fair)
  birdRadius: 15,
  hitboxScale: 0.85,      // slightly forgiving collisions
  maxStep: 1 / 30,        // a frame never simulates more than this (tab switches, slow frames)
  subStep: 1 / 120,       // physics runs in small slices so it behaves the same at 60 or 120 fps
  restartLockout: 0.45,   // after a crash, ignore taps this long so frantic taps don't skip the result

  // Coins and power-ups (Phase 3)
  coinChance: 0.7,        // chance that a gap holds a coin
  powerUpChance: 0.12,    // chance that a gap holds a power-up instead
  powerUpFirstAt: 4,      // no power-ups in the first few gaps of a run
  pickupRadius: 13,
  pickupSpread: 0.5,      // how far from the middle of the gap a pickup may sit (share of the gap)
  shieldGrace: 1.0,       // after the shield breaks, obstacles can't hurt for this long (time to fly clear)
  slowDuration: 5,        // slow motion lasts this many real seconds
  slowFactor: 0.6,        // the world runs at 60% speed during slow motion
  slowRamp: 0.25,         // seconds to ease into / out of slow motion (no jolt)

  // Changing worlds (Phase 4, places since Phase 6): Marrakech -> Fès -> Chefchaouen -> Desert
  // -> Coast -> Night -> Marrakech ... every `worldEvery` points.
  // Each new world is a little harder, up to a cap, so the game never becomes impossible.
  worldEvery: 20,
  worldCount: 6,          // number of places before the loop starts again
  gapShrinkPerWorld: 6,   // the opening gets this much smaller per world...
  speedUpPerWorld: 8,     // ...and obstacles come this much faster
  maxDifficulty: 4,       // no harder after the 4th world change (gap 146, speed 182)
  speedEase: 25,          // speed changes gently (units per second, per second) instead of jumping
};

function createGame(opts) {
  opts = opts || {};
  const t = Object.assign({}, TUNING, opts.tuning || {});
  const random = opts.random || Math.random;

  const g = {
    tuning: t,
    state: 'ready',       // ready | playing | paused | over
    score: 0,
    time: 0,
    overAt: 0,
    lastFlapAt: -1,       // used by the drawing code for a stronger wing beat after a flap
    worldWidth: 360,
    bird: { x: 0, y: 0, vy: 0, r: t.birdRadius },
    obstacles: [],
    distance: 0,          // total distance scrolled (drives the scenery layers)
    events: [],           // 'flap' | 'score' | 'crash' | 'coin' | 'shield' | 'slow' | 'shieldBreak' | 'slowEnd' | 'world'
    run: 0,               // counts runs, so the page knows when a new one starts
    coinsThisRun: 0,
    shield: false,        // shield active: the next hit is absorbed
    grace: 0,             // seconds left during which obstacles can't hurt (right after the shield breaks)
    shieldBrokeAt: -1,
    slowLeft: 0,          // real seconds of slow motion left
    timeScale: 1,         // 1 = normal speed, slowFactor during slow motion
    level: 0,             // how many worlds the player has reached this run (0, 1, 2, 3 ...)
    world: 0,             // which place: 0 Marrakech, 1 Fès, 2 Chefchaouen, 3 Desert, 4 Coast, 5 Night
    speed: t.scrollSpeed, // current scroll speed (eases towards the target for this level)
  };
  let spawned = 0;        // gaps created this run (power-ups only appear after the first few)
  let nextId = 0;         // each obstacle gets a number so it can be drawn as a minaret or a riad wall

  const playHeight = () => t.worldHeight - t.groundHeight;
  const birdHomeX = () => Math.min(g.worldWidth * 0.32, 170);
  const birdHomeY = () => t.worldHeight * 0.42;

  function emit(name) {
    g.events.push(name);
    if (g.events.length > 32) g.events.shift(); // never grows without limit if nobody listens
  }

  function reset() {
    g.state = 'ready';
    g.score = 0;
    g.obstacles = [];
    g.bird.x = birdHomeX();
    g.bird.y = birdHomeY();
    g.bird.vy = 0;
    g.coinsThisRun = 0;
    g.shield = false;
    g.grace = 0;
    g.slowLeft = 0;
    g.timeScale = 1;
    g.level = 0;
    g.world = 0;
    g.speed = t.scrollSpeed;
    spawned = 0;
  }

  // Difficulty for a level: smaller gap and faster scrolling, capped.
  function difficulty(level) {
    const d = Math.min(level, t.maxDifficulty);
    return { gap: t.gapSize - t.gapShrinkPerWorld * d, speed: t.scrollSpeed + t.speedUpPerWorld * d };
  }
  g.difficulty = difficulty;

  function randomGapCenter(prev, gap) {
    const min = t.gapMargin + gap / 2;
    const max = playHeight() - t.gapMargin - gap / 2;
    let lo = min, hi = max;
    if (prev != null) {
      lo = Math.max(min, prev - t.maxGapShift);
      hi = Math.min(max, prev + t.maxGapShift);
    }
    return lo + random() * (hi - lo);
  }

  // What sits in a gap: a coin, a power-up, or nothing. Never two copies of a power-up
  // on screen, and never one the player already has running.
  function choosePickup() {
    const r = random();
    if (spawned > t.powerUpFirstAt && r < t.powerUpChance) {
      const onScreen = new Set(g.obstacles.map(o => o.pickup && !o.pickup.taken && o.pickup.type));
      const options = ['shield', 'slow'].filter(p =>
        !onScreen.has(p) && !(p === 'shield' && g.shield) && !(p === 'slow' && g.slowLeft > 0));
      if (options.length) return options[Math.floor(random() * options.length) % options.length];
      return 'coin';
    }
    return r < t.powerUpChance + t.coinChance ? 'coin' : null;
  }

  function makeObstacle(x, prevGap) {
    // Each obstacle keeps the gap size of the moment it was made, so a world change
    // never resizes an opening the player is already flying towards.
    const gap = difficulty(g.level).gap;
    const gapY = randomGapCenter(prevGap, gap);
    spawned++;
    const type = choosePickup();
    const pickup = type && {
      type,
      y: gapY + (random() - 0.5) * gap * t.pickupSpread,
      taken: false,
    };
    // `world` is the place the obstacle was built in; it keeps that look after a world change.
    return { id: nextId++, x, gapY, gap, passed: false, pickup, world: g.world };
  }

  function fillObstacles() {
    if (g.obstacles.length === 0) {
      g.obstacles.push(makeObstacle(g.bird.x + t.firstObstacleAhead, null));
    }
    let last = g.obstacles[g.obstacles.length - 1];
    while (last.x + t.obstacleSpacing < g.worldWidth + t.obstacleWidth) {
      last = makeObstacle(last.x + t.obstacleSpacing, last.gapY);
      g.obstacles.push(last);
    }
    while (g.obstacles.length && g.obstacles[0].x + t.obstacleWidth < -20) g.obstacles.shift();
  }

  function circleHitsRect(cx, cy, r, x, y, w, h) {
    if (h <= 0) return false;
    const nx = Math.max(x, Math.min(cx, x + w));
    const ny = Math.max(y, Math.min(cy, y + h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function crash() {
    g.state = 'over';
    g.overAt = g.time;
    g.shield = false;
    g.grace = 0;
    g.slowLeft = 0;
    g.timeScale = 1;       // the fall after a crash plays at normal speed
    emit('crash');
  }

  // The shield takes the hit instead of the stork. Returns true if it did.
  function absorbHit() {
    if (!g.shield) return false;
    g.shield = false;
    g.grace = t.shieldGrace;
    g.shieldBrokeAt = g.time;
    emit('shieldBreak');
    return true;
  }

  function collect(p) {
    p.taken = true;
    if (p.type === 'coin') { g.coinsThisRun += 1; emit('coin'); }
    else if (p.type === 'shield') { g.shield = true; emit('shield'); }
    else if (p.type === 'slow') { g.slowLeft = t.slowDuration; emit('slow'); }
  }

  // Slow motion counts down in real seconds, and the world speed eases in and out.
  function updateSlow(h) {
    if (g.slowLeft > 0) {
      g.slowLeft = Math.max(0, g.slowLeft - h);
      if (g.slowLeft === 0) emit('slowEnd');
    }
    const target = g.slowLeft > 0 ? t.slowFactor : 1;
    const rate = (1 - t.slowFactor) / t.slowRamp * h;
    if (g.timeScale < target) g.timeScale = Math.min(target, g.timeScale + rate);
    else g.timeScale = Math.max(target, g.timeScale - rate);
  }

  function tick(h) {
    g.time += h;
    const b = g.bird;

    if (g.state === 'ready') {
      b.y = birdHomeY() + Math.sin(g.time * 4) * 6;
      g.distance += t.scrollSpeed * h;
      return;
    }
    if (g.state === 'paused') return;

    if (g.state === 'playing') updateSlow(h);
    const s = h * g.timeScale;          // world time: shorter than real time during slow motion

    // Physics (also runs after a crash so the stork drops to the ground)
    b.vy = Math.min(b.vy + t.gravity * s, t.maxFallSpeed);
    b.y += b.vy * s;
    if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) b.vy = 0; }   // can't escape off the top
    const groundTop = playHeight();
    if (b.y + b.r >= groundTop) {
      b.y = groundTop - b.r;
      b.vy = 0;
      if (g.state === 'playing') {
        if (absorbHit()) b.vy = t.flapVelocity;   // shield bounces the stork off the ground
        else crash();
      }
    }
    if (g.state !== 'playing') return;

    // Scroll obstacles (speed eases towards this level's target)
    const target = difficulty(g.level).speed;
    if (g.speed < target) g.speed = Math.min(target, g.speed + t.speedEase * s);
    g.distance += g.speed * s;
    for (const o of g.obstacles) o.x -= g.speed * s;
    fillObstacles();
    if (g.grace > 0) g.grace = Math.max(0, g.grace - s);

    const hr = b.r * t.hitboxScale;
    for (const o of g.obstacles) {
      const p = o.pickup;
      if (p && !p.taken) {
        const dx = b.x - (o.x + t.obstacleWidth / 2), dy = b.y - p.y, rr = b.r + t.pickupRadius;
        if (dx * dx + dy * dy < rr * rr) collect(p);
      }
      const top = o.gapY - o.gap / 2;
      const bottom = o.gapY + o.gap / 2;
      if (g.grace <= 0 &&
          (circleHitsRect(b.x, b.y, hr, o.x, 0, t.obstacleWidth, top) ||
           circleHitsRect(b.x, b.y, hr, o.x, bottom, t.obstacleWidth, groundTop - bottom))) {
        if (!absorbHit()) { crash(); return; }
      }
      if (!o.passed && o.x + t.obstacleWidth < b.x) {
        o.passed = true;
        g.score += 1;
        emit('score');
        const level = Math.floor(g.score / t.worldEvery);
        if (level !== g.level) {
          g.level = level;
          g.world = level % t.worldCount;
          emit('world');
        }
      }
    }
  }

  function flap() {
    g.bird.vy = t.flapVelocity; // sets speed, never adds: rapid taps can't launch the stork
    g.lastFlapAt = g.time;
    emit('flap');
  }

  // Public API ---------------------------------------------------------------

  // The one player action: tap / click / Space. Returns what it did.
  g.input = function () {
    if (g.state === 'ready') {
      g.state = 'playing';
      g.run += 1;
      fillObstacles();
      flap();
      return 'start';
    }
    if (g.state === 'playing') {
      flap();
      return 'flap';
    }
    if (g.state === 'paused') {
      g.state = 'playing';        // resume without flapping, so the player can get their bearings
      return 'resume';
    }
    if (g.state === 'over') return g.restart() ? 'restart' : 'ignored';
    return 'ignored';
  };

  g.canRestart = function () {
    return g.state === 'over' && g.time - g.overAt >= t.restartLockout;
  };

  g.restart = function () {
    if (!g.canRestart()) return false;
    reset();
    return true;
  };

  g.pause = function () {
    if (g.state === 'playing') { g.state = 'paused'; return true; }
    return false;
  };

  g.step = function (dt) {
    if (!(dt > 0)) return;
    dt = Math.min(dt, t.maxStep);
    while (dt > 1e-9) {
      const h = Math.min(dt, t.subStep);
      tick(h);
      dt -= h;
    }
  };

  // Hands the sound code everything that happened since the last call.
  g.takeEvents = function () {
    const e = g.events;
    g.events = [];
    return e;
  };

  // Screen size changed (rotation, window resize). Only the visible width changes.
  // The stork keeps its position during a run so it is never teleported into an obstacle.
  g.setWorldWidth = function (w) {
    g.worldWidth = Math.max(200, w);
    if (g.state === 'ready') g.bird.x = birdHomeX();
    if (g.state === 'playing' || g.state === 'paused') fillObstacles();
  };

  g.reset = reset;
  reset();
  return g;
}

// Player settings saved on the device. If storage is blocked or broken, the game keeps
// working with defaults and simply doesn't remember.
function createSettings(storage) {
  const KEY = 'bellarej.settings.v1';
  const defaults = { lang: 'en', muted: false };
  let data = Object.assign({}, defaults);
  try {
    const raw = storage && storage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && (p.lang === 'en' || p.lang === 'ar')) data.lang = p.lang;
      if (p && typeof p.muted === 'boolean') data.muted = p.muted;
    }
  } catch (e) { /* blocked or corrupted: keep defaults */ }

  function save() {
    try { if (storage) storage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  return {
    get lang() { return data.lang; },
    get muted() { return data.muted; },
    setLang(l) { if (l === 'en' || l === 'ar') { data.lang = l; save(); } },
    setMuted(m) { data.muted = !!m; save(); },
  };
}

// Player progress saved on the device: best score, coins, owned and selected characters.
// Like settings, it keeps working in memory if storage is blocked.
// Phase 6: six outfits for the hero (looks only, same size and hitbox).
const CHARACTERS = [
  { id: 'classic', price: 0 },
  { id: 'riad', price: 40 },
  { id: 'chefchaouen', price: 80 },
  { id: 'desert', price: 140 },
  { id: 'night', price: 220 },
  { id: 'royal', price: 350 },
];
// Saves from before Phase 6 used bird names; each old bird becomes the outfit at the same place
// in the shop, so nobody loses what they paid for.
const LEGACY_CHARACTERS = { stork: 'classic', hoopoe: 'riad', seagull: 'chefchaouen', falcon: 'desert' };

function createProgress(storage) {
  const KEY = 'bellarej.progress.v1';
  const ids = CHARACTERS.map(c => c.id);
  const data = { best: 0, coins: 0, owned: ['classic'], selected: 'classic' };
  const modern = (id) => (Object.prototype.hasOwnProperty.call(LEGACY_CHARACTERS, id) ? LEGACY_CHARACTERS[id] : id);
  const count = (v) => (Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0);
  try {
    const raw = storage && storage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p) {
        data.best = count(p.best);
        data.coins = count(p.coins);
        if (Array.isArray(p.owned)) {
          for (const old of p.owned) {
            const id = modern(old);
            if (ids.includes(id) && !data.owned.includes(id)) data.owned.push(id);
          }
        }
        if (data.owned.includes(modern(p.selected))) data.selected = modern(p.selected);
      }
    }
  } catch (e) { /* blocked or corrupted: start fresh */ }

  function save() {
    try { if (storage) storage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  return {
    get best() { return data.best; },
    get coins() { return data.coins; },
    get owned() { return data.owned.slice(); },
    get selected() { return data.selected; },
    owns(id) { return data.owned.includes(id); },
    addCoins(n) { n = count(n); if (n) { data.coins += n; save(); } },
    // Returns true when this score beats the best.
    recordBest(score) {
      score = count(score);
      if (score <= data.best) return false;
      data.best = score; save(); return true;
    },
    // 'bought' | 'owned' | 'poor' | 'unknown'. A second tap on Buy finds it owned: charged once.
    buy(id) {
      const c = CHARACTERS.find(c => c.id === id);
      if (!c) return 'unknown';
      if (data.owned.includes(id)) return 'owned';
      if (data.coins < c.price) return 'poor';
      data.coins -= c.price;
      data.owned.push(id);
      save();
      return 'bought';
    },
    select(id) {
      if (!data.owned.includes(id)) return false;
      data.selected = id; save(); return true;
    },
  };
}

if (typeof module !== 'undefined') module.exports = { createGame, createSettings, createProgress, CHARACTERS, LEGACY_CHARACTERS, TUNING };

</script>

      install: 'Install app', iosHint: 'On iPhone or iPad: tap Share, then “Add to Home Screen”.',
      paused: 'Paused', tapToContinue: 'Tap to continue', pause: 'Pause',
      gameOver: 'Game over', score: 'Score', again: 'Play again',
      langButton: 'عربي', langLabel: 'التبديل إلى العربية',
      mute: 'Mute sound', stage: 'Bellarej game. Tap, click or press Space to fly.',
      best: 'Best', coins: 'Coins', newBest: 'New best!', shield: 'Shield',
      worlds: ['Marrakech', 'Fès', 'Chefchaouen', 'Desert', 'Coast', 'Night'],
      shop: 'Shop', back: 'Back', choose: 'Choose', chosen: 'Chosen', buy: 'Buy',

    let ac = null, master = null, noise = null;
    function unlock() {

          const AC = window.AudioContext || window.webkitAudioContext;

      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(start); s.stop(start + dur + 0.02);

  function hash(i, salt) {
